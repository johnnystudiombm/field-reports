<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Studio MBM Field Reports</title>
<style>
/* Layout: Studio MBM's field report as a working app. Logo top-left on a white title bar; one working column; reports render like the issued PDF (# | Status | Date/Description/Photo). MBM blue is the brand accent; redline red is reserved for open and critical items and markups. */
:root {
  --paper: #eff1f6;
  --sheet: #ffffff;
  --sheet-2: #f5f6fa;
  --ink: #1a1f2b;
  --ink-2: #545c6c;
  --ink-3: #8a91a0;
  --rule: #d8dce6;
  --rule-strong: #bcc2d0;
  --mbm: #293d9a;
  --mbm-ink: #ffffff;
  --mbm-soft: #e7eaf7;
  --redline: #cf2f25;
  --redline-soft: #fbe6e4;
  --amber: #a5650c;
  --amber-soft: #fbefd9;
  --green: #2a7748;
  --green-soft: #e0f1e6;
  --shadow: 0 1px 2px rgba(20, 28, 60, .06), 0 6px 20px rgba(20, 28, 60, .06);
  --scrim: rgba(12, 15, 26, .72);
  --f-display: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --f-body: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --f-mono: Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10131b; --sheet: #181c27; --sheet-2: #1e2330; --ink: #e6e9f0; --ink-2: #a2a9b8; --ink-3: #6f7686;
    --rule: #2a3040; --rule-strong: #3a4256; --mbm: #93a5f5; --mbm-ink: #10142a; --mbm-soft: #1e2645;
    --redline: #ff6a5e; --redline-soft: #3b1c1a; --amber: #e6ae55; --amber-soft: #352914; --green: #62c38b; --green-soft: #16301f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.8); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10131b; --sheet: #181c27; --sheet-2: #1e2330; --ink: #e6e9f0; --ink-2: #a2a9b8; --ink-3: #6f7686;
  --rule: #2a3040; --rule-strong: #3a4256; --mbm: #93a5f5; --mbm-ink: #10142a; --mbm-soft: #1e2645;
  --redline: #ff6a5e; --redline-soft: #3b1c1a; --amber: #e6ae55; --amber-soft: #352914; --green: #62c38b; --green-soft: #16301f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.8); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mbm); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Title bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.bar-in { max-width: 1120px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; background: none; border: 0; padding: 0; cursor: pointer; color: var(--mbm); }
.brand svg { height: 34px; width: auto; display: block; flex: none; }
.brand .div { width: 1px; height: 28px; background: var(--rule-strong); }
.brand .lbl { font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.bar .spacer { flex: 1; }
@media (max-width: 520px) { .brand .div, .brand .lbl { display: none; } }

.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--rule-strong); background: var(--sheet); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--mbm); color: var(--mbm-ink); border-color: var(--mbm); }
.btn.primary:hover { opacity: .92; }
.btn.red { color: var(--redline); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--sheet-2); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }

.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
h2.view-title { font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1.05; margin: 0; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.muted { color: var(--ink-2); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin: 14px 0 16px; }
.tab { background: none; border: 0; padding: 10px 14px; font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--mbm); }
.tab .n { font-family: var(--f-mono); font-size: 12px; font-weight: 400; color: var(--ink-3); margin-left: 4px; }

/* Status chips (filters) */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet); cursor: pointer; text-align: left; }
.chip .k { font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.chip .k::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.chip.open .k::before { background: var(--redline); }
.chip.pending .k::before { background: var(--amber); }
.chip.closed .k::before { background: var(--green); }
.chip .v { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--mbm); box-shadow: 0 0 0 1px var(--mbm) inset; background: var(--mbm-soft); }

/* Filters */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 14px; }
.input, select.input, textarea.input { width: 100%; min-height: 40px; padding: 8px 11px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--sheet); }
textarea.input { min-height: 88px; resize: vertical; line-height: 1.5; }
.input::placeholder { color: var(--ink-3); }
.toolbar .search { flex: 1 1 220px; min-width: 0; }
.toolbar select { flex: 0 1 200px; width: auto; min-width: 0; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.check input { width: 16px; height: 16px; accent-color: var(--redline); }
.tally { font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }

/* Items tracker */
.trk { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.trk { overflow-x: auto; }
.trk-head, .trk-row { display: grid; grid-template-columns: var(--trk-cols, 52px minmax(0, 1fr) 150px 110px 100px 112px); gap: 14px; min-width: 760px; align-items: start; padding: 12px 16px; }
.trk-head { background: var(--sheet-2); border-bottom: 1px solid var(--rule); font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding-block: 9px; }
.trk-row { border-bottom: 1px solid var(--rule); cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.trk-row:last-child { border-bottom: 0; }
.trk-row:hover { background: var(--sheet-2); }
.trk-num { font-family: var(--f-display); font-weight: 700; font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; }
.trk-title { font-weight: 600; text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
.trk-desc { font-size: 14px; color: var(--ink-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.trk-desc.crit, .crit-text { color: var(--redline); }
.trk-upd { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.trk-upd b { font-family: var(--f-mono); font-weight: 500; font-size: 12px; color: var(--ink-3); }
.trk-cell { font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.trk-cell small { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.trk-lbl { display: none; }
@media (max-width: 860px) {
  .trk-head { display: none; }
  .trk-head, .trk-row { min-width: 0; }
  .trk-row { grid-template-columns: 44px minmax(0, 1fr) auto; gap: 6px 12px; }
  .trk-row .c-cf, .trk-row .c-created { grid-column: 1 / -1; }
  .trk-row .trk-num { grid-row: 1; grid-column: 1; }
  .trk-row .c-proj { grid-row: 1; grid-column: 2; align-self: center; }
  .trk-row .c-status { grid-row: 1; grid-column: 3; justify-self: end; }
  .trk-row .c-main { grid-row: 2; grid-column: 1 / -1; }
  .trk-row .c-resp { grid-row: 3; grid-column: 1 / 3; }
  .trk-row .c-last { grid-row: 3; grid-column: 3; justify-self: end; }
  .trk-lbl { display: inline; color: var(--ink-3); font-size: 12px; margin-right: 4px; }
}

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.open { color: var(--redline); background: var(--redline-soft); }
.pill.pending { color: var(--amber); background: var(--amber-soft); }
.pill.closed { color: var(--green); background: var(--green-soft); }
.pill.none { color: var(--ink-3); background: var(--sheet-2); }
.pill.crit { color: var(--redline); background: transparent; border: 1px solid var(--redline); }
.pill.crit::before { display: none; }
.status-sel { border: 1px solid var(--rule-strong); border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; background: var(--sheet); cursor: pointer; }
.cell-sel { border: 1px solid var(--rule-strong); border-radius: 6px; padding: 4px 6px; font-size: 13px; background: var(--sheet); cursor: pointer; max-width: 100%; color: var(--ink); }
.cell-sel.unset { color: var(--ink-3); border-style: dashed; }
.cell-sel:hover { border-color: var(--mbm); }
.status-sel.open { color: var(--redline); border-color: var(--redline); }
.status-sel.pending { color: var(--amber); border-color: var(--amber); }
.status-sel.closed { color: var(--green); border-color: var(--green); }

/* Report list */
.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; text-align: left; width: 100%; }
.row:hover { border-color: var(--rule-strong); box-shadow: var(--shadow); }
.datecell { text-align: center; border-right: 1px solid var(--rule); padding-right: 14px; }
.datecell .m { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }
.datecell .d { font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1; }
.datecell .y { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.row-main { min-width: 0; }
.row-proj { font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.15; }
.row-meta { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.row-side { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
@media (max-width: 560px) {
  .row { grid-template-columns: 52px minmax(0, 1fr); gap: 12px; padding: 12px; }
  .row-side { grid-column: 1 / -1; justify-content: flex-start; }
  .datecell { padding-right: 10px; }
}

.empty { background: var(--sheet); border: 1px dashed var(--rule-strong); border-radius: 8px; padding: 36px 20px; text-align: center; }
.empty h3 { font-family: var(--f-display); font-size: 17px; text-transform: uppercase; margin: 0 0 6px; }
.empty p { margin: 0 auto 16px; max-width: 48ch; color: var(--ink-2); }
.notice { padding: 10px 14px; border-radius: 6px; background: var(--mbm-soft); color: var(--ink); font-size: 14px; margin-bottom: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }

/* Report sheet (mirrors the PDF) */
.back { margin-bottom: 14px; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: clamp(18px, 4vw, 44px); }
.sheet-run { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 18px; gap: 12px; }
.sheet h2 { font-family: var(--f-body); font-weight: 700; font-size: clamp(24px, 4vw, 30px); margin: 0 0 12px; line-height: 1.15; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; font-size: 14px; margin-bottom: 18px; }
.kv dt { font-weight: 700; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.disclaim { font-size: 13px; color: var(--ink-2); max-width: 90ch; margin: 0 0 14px; }
.legend { border-top: 1px solid var(--ink); padding-top: 10px; font-size: 13px; margin-bottom: 18px; }
.legend p { margin: 0; }
.rtable-wrap { overflow-x: auto; }
table.rtable { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
table.rtable th, table.rtable td { border: 1px solid var(--ink); padding: 6px 8px; vertical-align: top; text-align: left; }
table.rtable th { font-weight: 700; }
table.rtable td.n { width: 44px; font-weight: 700; }
table.rtable td.s { width: 120px; }
table.rtable td.cf { width: 96px; }
.it-title { text-decoration: underline; text-underline-offset: 2px; }
.it-desc { white-space: pre-wrap; overflow-wrap: anywhere; }
.it-desc strong { font-weight: 700; }
.it-upd { margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.it-upd .dt { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); margin-right: 6px; }
.it-photos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.it-ph { display: grid; gap: 3px; width: min(220px, 100%); }
.it-ph .lab { font-size: 13px; }
.it-ph button { display: block; width: 100%; padding: 0; border: 1px solid var(--rule); background: var(--sheet-2); cursor: zoom-in; border-radius: 3px; overflow: hidden; position: relative; aspect-ratio: 4 / 3; max-width: 100%; }
.it-ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.it-ph .tag { z-index: 1; }
.it-ph .tag, .tag { position: absolute; left: 4px; top: 4px; font-family: var(--f-mono); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: rgba(207, 47, 37, .92); padding: 2px 5px; border-radius: 3px; }
.it-ph .ph-when { font-size: 11px; color: var(--ink-3); }
.it-pdf { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mbm); font-weight: 600; }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--sheet); cursor: pointer; color: var(--ink); }
.choice:hover, .choice:focus-visible { border-color: var(--mbm); background: var(--mbm-soft); }
.choice .c-main { display: grid; gap: 2px; flex: 1; min-width: 0; }
.choice .c-sub { font-size: 13px; color: var(--ink-2); }
.choice .c-go { font-size: 18px; color: var(--mbm); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.later { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.later button { background: none; border: 0; padding: 0; color: var(--mbm); text-decoration: underline; cursor: pointer; font-size: 12px; }

/* Form */
.form { display: grid; gap: 20px; }
.fs { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 18px; display: grid; gap: 14px; }
.fs > h3 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center; gap: 10px; }
.fs > h3 .n { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); font-weight: 400; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.fld { display: grid; gap: 5px; min-width: 0; }
.fld label, .fld .lbl-row { font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fld .req { color: var(--redline); }
.hint { font-size: 12px; color: var(--ink-3); }
.err { color: var(--redline); font-size: 13px; }
.bold-btn { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 4px; font-weight: 700; font-size: 12px; padding: 1px 8px; cursor: pointer; color: var(--ink); }
.icards { display: grid; gap: 14px; }
.icard { border: 1px solid var(--rule-strong); border-radius: 8px; padding: 14px; display: grid; gap: 12px; background: var(--sheet); }
.icard.carried { border-left: 4px solid var(--mbm); }
.icard.is-crit { border-color: var(--redline); }
.icard-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.inum { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1; }
.inum small { font-family: var(--f-mono); font-size: 11px; font-weight: 400; color: var(--ink-3); margin-left: 6px; letter-spacing: .04em; }
.icard-head .sp { flex: 1; }
.icard-head .status-sel { padding: 6px 10px; font-size: 13px; }
.hist { background: var(--sheet-2); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; font-size: 14px; }
.hist .h-row { white-space: pre-wrap; overflow-wrap: anywhere; }
.hist .dt { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); margin-right: 6px; }
.ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.att { border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--sheet); display: grid; min-width: 0; }
.att .pv { aspect-ratio: 4 / 3; max-width: 100%; min-height: 0; overflow: hidden; background: var(--sheet-2); display: grid; place-items: center; position: relative; }
.att .pv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.att .pv .tag { z-index: 1; }
.att .pv .pdf { font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--redline); }
.att .body { padding: 8px; display: grid; gap: 6px; }
.att .nm { font-size: 11px; color: var(--ink-3); font-family: var(--f-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .body .input { min-height: 32px; padding: 5px 8px; font-size: 13px; }
.att .row-btns { display: flex; gap: 6px; }
.att .row-btns .btn { flex: 1; padding: 0 6px; }
.att.pending .pv { color: var(--ink-3); font-size: 13px; }
.up-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.up-row.over { outline: 2px dashed var(--mbm); outline-offset: 4px; border-radius: 6px; }
.spin { width: 22px; height: 22px; border: 2px solid var(--rule-strong); border-top-color: var(--mbm); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.form-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--paper) 70%, transparent); }
.icon-btn { width: 34px; height: 34px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { color: var(--redline); border-color: var(--redline); }
.icon-btn svg { width: 16px; height: 16px; }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { background: var(--sheet); border-radius: 10px; padding: 20px; width: min(440px, 100%); box-shadow: var(--shadow); display: grid; gap: 14px; max-height: 100%; overflow: auto; }
.dialog h4 { margin: 0; font-family: var(--f-display); font-size: 17px; text-transform: uppercase; }
.dialog p { margin: 0; color: var(--ink-2); }
.dialog .actions { justify-content: flex-end; margin: 0; }
.dialog.wide { width: min(760px, 100%); }
.tl { display: grid; gap: 0; }
.tl-e { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule); }
.tl-e:first-child { border-top: 0; }
.tl-e .d { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }

.lb { flex-direction: column; gap: 10px; }
.lb img { max-width: 100%; max-height: calc(100% - 90px); object-fit: contain; border-radius: 4px; background: #000; }
.lb .lb-cap { color: #f1f3f5; font-size: 14px; text-align: center; max-width: 70ch; }
.lb .lb-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.lb .btn { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.25); }
.prog { display: grid; gap: 10px; }
.prog .bar2 { height: 6px; background: var(--sheet-2); border-radius: 3px; overflow: hidden; }
.prog .bar2 i { display: block; height: 100%; width: 0; background: var(--mbm); transition: width .2s; }

/* Markup editor */
.mk { position: fixed; inset: 0; z-index: 60; background: #0d1014; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); color: #eef1f4; }
.mk-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 12px; border-bottom: 1px solid #262d35; }
.mk-tools .grp { display: flex; gap: 4px; align-items: center; padding-right: 8px; margin-right: 2px; border-right: 1px solid #262d35; }
.mk-tools .grp:last-child { border-right: 0; }
.tool { min-width: 38px; height: 36px; padding: 0 9px; border-radius: 6px; border: 1px solid #333c46; background: #171c22; color: #eef1f4; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; }
.tool[aria-pressed="true"] { background: #eef1f4; color: #0d1014; border-color: #eef1f4; }
.tool svg { width: 18px; height: 18px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #333c46; cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px #0d1014 inset; }
.mk-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; position: relative; overflow: hidden; }
.mk-stage canvas { max-width: 100%; max-height: 100%; touch-action: none; cursor: crosshair; background: #000; }
.mk-text { position: absolute; z-index: 2; min-width: 160px; padding: 6px 8px; border-radius: 4px; border: 2px solid #fff; background: rgba(13,16,20,.9); color: #fff; font: 600 16px var(--f-body); }
.mk-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 12px; border-top: 1px solid #262d35; flex-wrap: wrap; align-items: center; }
.mk-foot .hint { color: #8a949e; flex: 1; min-width: 160px; }
.mk-foot .btn { background: #171c22; color: #eef1f4; border-color: #333c46; }
.mk-foot .btn.primary { background: #ff5b4f; border-color: #ff5b4f; color: #fff; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--sheet); padding: 10px 16px; border-radius: 8px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
</style>

</head>
<body>
<header class="bar">
  <div class="bar-in">
    <button class="brand" data-action="home" aria-label="Studio MBM field reports home">
      <span id="logo-slot"></span>
      <span class="div" aria-hidden="true"></span>
      <span class="lbl">Field Reports</span>
    </button>
    <span class="spacer"></span>
    <button class="btn primary" id="newBtn" data-action="new" hidden>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      New report
    </button>
  </div>
</header>

<main class="wrap" id="app">
  <div class="empty">
    <h3>Loading field reports</h3>
    <p>Connecting to Studio MBM's shared report log. Open items, reports, photos and markups will appear here.</p>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
// Studio MBM Field Reports: Supabase connection (login, reports, photos, live updates).
// The app below talks to window.claude.use(...); this file answers those calls with Supabase.
(() => {
  'use strict';
  const cfg = window.SMBM_CONFIG || {};
  const configured = !!(cfg.supabaseUrl && cfg.supabaseAnonKey && !/YOUR[-_]/i.test(cfg.supabaseUrl + cfg.supabaseAnonKey));
  const hashType = new URLSearchParams((location.hash || '').slice(1)).get('type');
  const BUCKET = 'photos';
  let sb = null, session = null, readyResolve, needPassword = false;
  const ready = new Promise((r) => { readyResolve = r; });
  const urlCache = new Map();   // storage path -> { url, exp }
  const people = new Map();     // user id -> email
  let reportCount = null;

  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- photo links (private bucket, short-lived signed links) ----------
  window.SMBM_blobUrl = (id) => { const c = urlCache.get(id); return c ? c.url : ''; };
  async function signPaths(paths) {
    const now = Date.now();
    const need = [...new Set(paths.filter(Boolean))].filter((p) => !urlCache.has(p) || urlCache.get(p).exp - now < 30 * 60e3);
    for (let i = 0; i < need.length; i += 100) {
      const chunk = need.slice(i, i + 100);
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(chunk, 6 * 3600);
      if (error || !data) { console.warn('Photo links failed', error); continue; }
      data.forEach((d) => { if (d && d.signedUrl && !d.error) urlCache.set(d.path, { url: d.signedUrl, exp: now + 6 * 3600e3 }); });
    }
  }

  // ---------- helpers ----------
  const dbErr = (error) => ({
    code: error && (error.code === '42501' || /row-level security|permission/i.test(error.message || '')) ? 'invalid_argument' : 'unavailable',
    message: (error && error.message) || 'Request failed'
  });
  function deepMerge(base, patch) {
    const out = { ...(base || {}) };
    Object.entries(patch || {}).forEach(([k, v]) => {
      const cur = out[k];
      out[k] = v && typeof v === 'object' && !Array.isArray(v) && cur && typeof cur === 'object' && !Array.isArray(cur) ? deepMerge(cur, v) : v;
    });
    return out;
  }
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

  // ---------- reports ----------
  const reportListeners = new Set();
  let reportTimer = null;
  async function fetchReports() {
    const { data, error } = await sb.from('reports').select('id,data').order('created_at', { ascending: false }).limit(2000);
    if (error) throw error;
    const paths = [];
    data.forEach((row) => {
      const d = row.data || {};
      if (d.author && d.authorEmail) people.set(d.author, d.authorEmail);
      (d.items || []).forEach((i) => (i.photos || []).forEach((p) => { paths.push(p.id); if (p.original) paths.push(p.original); }));
    });
    await signPaths(paths);
    reportCount = data.length; updateHeader();
    return { docs: data.map((row) => ({ id: row.id, exists: true, data: () => row.data || {}, metadata: { fromCache: false, hasPendingWrites: false } })), size: data.length, empty: !data.length };
  }
  async function deliverReports() {
    try { const snap = await fetchReports(); reportListeners.forEach((l) => l.next(snap)); }
    catch (e) { console.warn('Loading reports failed', e); }
  }
  const scheduleReports = () => { clearTimeout(reportTimer); reportTimer = setTimeout(deliverReports, 200); };
  function reportRef(id) {
    return {
      id, path: 'reports/' + id,
      async get() {
        const { data, error } = await sb.from('reports').select('id,data').eq('id', id).maybeSingle();
        if (error) throw dbErr(error);
        return { id, exists: !!data, data: () => (data ? data.data : undefined), metadata: {} };
      },
      async set(doc) {
        const data = { ...doc };
        if (data.author && data.author === session.user.id && !data.authorEmail) data.authorEmail = session.user.email;
        const { error } = await sb.from('reports').upsert({ id, data });
        if (error) throw dbErr(error);
        scheduleReports();
      },
      async update(patch) {
        const { data: row, error } = await sb.from('reports').select('data').eq('id', id).maybeSingle();
        if (error) throw dbErr(error);
        if (!row) throw { code: 'invalid_argument', message: 'Report not found' };
        const { error: e2 } = await sb.from('reports').update({ data: deepMerge(row.data, patch) }).eq('id', id);
        if (e2) throw dbErr(e2);
        scheduleReports();
      },
      async delete() {
        const { error } = await sb.from('reports').delete().eq('id', id);
        if (error) throw dbErr(error);
        scheduleReports();
      }
    };
  }
  const reportsQuery = {
    onSnapshot(next, err) { const l = { next, err }; reportListeners.add(l); deliverReports(); return () => reportListeners.delete(l); }
  };

  // ---------- settings ----------
  const settingsListeners = new Set();
  async function fetchSettings(id) {
    const { data, error } = await sb.from('settings').select('id,data').eq('id', id).maybeSingle();
    if (error) throw dbErr(error);
    return { id, exists: !!data, data: () => (data ? data.data : undefined), metadata: {} };
  }
  async function deliverSettings() { try { const s = await fetchSettings('app'); settingsListeners.forEach((l) => l(s)); } catch (e) { console.warn(e); } }
  function settingsRef(id) {
    return {
      id, path: 'settings/' + id,
      onSnapshot(next) { settingsListeners.add(next); fetchSettings(id).then(next).catch(() => {}); return () => settingsListeners.delete(next); },
      get: () => fetchSettings(id),
      async set(doc) { const { error } = await sb.from('settings').upsert({ id, data: doc }); if (error) throw dbErr(error); deliverSettings(); },
      async update(patch) {
        const cur = await fetchSettings(id);
        const { error } = await sb.from('settings').upsert({ id, data: deepMerge(cur.exists ? cur.data() : {}, patch) });
        if (error) throw dbErr(error);
        deliverSettings();
      }
    };
  }

  const db = {
    collection(name) {
      if (name !== 'reports') throw new TypeError('Unknown collection ' + name);
      return { orderBy: () => ({ limit: () => reportsQuery }), doc: (id) => reportRef(id || newId()) };
    },
    doc(path) { return settingsRef(String(path).split('/')[1] || 'app'); }
  };

  // ---------- photos & PDFs ----------
  const assets = {
    async upload(blob, opts) {
      const type = (opts && opts.type) || blob.type || 'image/jpeg';
      const ext = type === 'application/pdf' ? 'pdf' : type === 'image/png' ? 'png' : type === 'image/webp' ? 'webp' : 'jpg';
      const d = new Date();
      const path = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${newId()}.${ext}`;
      const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: type, upsert: false });
      if (error) {
        const m = String(error.message || '');
        throw { code: /size|large|exceed/i.test(m) ? 'too_large' : /mime|type/i.test(m) ? 'unsupported_type' : 'upstream_error', message: m };
      }
      await signPaths([path]);
      return { id: path, url: window.SMBM_blobUrl(path), sizeBytes: blob.size, contentType: type };
    },
    async delete(id) { const { error } = await sb.storage.from(BUCKET).remove([id]); return { deleted: !error }; }
  };

  // ---------- people ----------
  const user = {
    id: async () => session.user.id,
    isOwner: async () => false,
    canEdit: async () => true,
    can: async () => true,
    name: async () => session.user.email,
    async profiles(ids) {
      const out = {};
      [].concat(ids || []).forEach((i) => {
        const me = i === session.user.id;
        out[i] = { id: i, name: me ? session.user.email : (people.get(i) || ''), avatarUrl: '', color: '', email: null, isMe: me, guest: false };
      });
      return out;
    }
  };

  // ---------- PDF downloads ----------
  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return { status: 'saved' };
    }
  };

  window.claude = { use: async (name) => { await ready; return ({ db, user, assets, downloads })[name] || null; } };

  // ---------- sign-in screen ----------
  let panel = null;
  function showPanel(mode, msg) {
    if (!panel) {
      panel = document.createElement('div');
      panel.className = 'overlay'; panel.id = 'auth'; panel.style.zIndex = 90; panel.style.background = 'var(--paper)';
      document.body.appendChild(panel);
      panel.addEventListener('submit', onSubmit);
      panel.addEventListener('click', (e) => { const b = e.target.closest('[data-mode]'); if (b) { e.preventDefault(); showPanel(b.dataset.mode); } });
    }
    const logo = (document.getElementById('logo-slot') || {}).innerHTML || '';
    const note = msg ? `<p class="${msg.err ? 'err' : 'muted'}" role="${msg.err ? 'alert' : 'status'}" style="margin:0;font-size:14px">${esc(msg.text)}</p>` : '';
    const forms = {
      setup: `<h4>Finish setup</h4><p>Open <b>config.js</b> in your GitHub repository and paste your Supabase Project URL and anon public key, then reload this page.</p>`,
      signin: `<h4>Sign in</h4>
        <form data-form="signin" style="display:grid;gap:12px">
          <div class="fld"><label for="au-email">Email</label><input class="input" id="au-email" type="email" autocomplete="email" required></div>
          <div class="fld"><label for="au-pw">Password</label><input class="input" id="au-pw" type="password" autocomplete="current-password" required></div>
          ${note}
          <button class="btn primary" type="submit">Sign in</button>
          <button class="btn ghost" type="button" data-mode="forgot">Forgot password?</button>
        </form>`,
      forgot: `<h4>Reset password</h4>
        <form data-form="forgot" style="display:grid;gap:12px">
          <p style="margin:0">We'll email you a link to set a new password.</p>
          <div class="fld"><label for="au-email2">Email</label><input class="input" id="au-email2" type="email" autocomplete="email" required></div>
          ${note}
          <button class="btn primary" type="submit">Send reset link</button>
          <button class="btn ghost" type="button" data-mode="signin">Back to sign in</button>
        </form>`,
      setpw: `<h4>Set your password</h4>
        <form data-form="setpw" style="display:grid;gap:12px">
          <p style="margin:0">Signed in as ${esc(session && session.user.email)}. Choose a password for next time.</p>
          <div class="fld"><label for="au-new">New password</label><input class="input" id="au-new" type="password" autocomplete="new-password" minlength="8" required></div>
          ${note}
          <button class="btn primary" type="submit">Save password</button>
        </form>`
    };
    panel.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-label="Sign in">
      <div style="color:var(--mbm);height:40px;display:flex">${logo.replace('<svg', '<svg style="height:40px;width:auto"')}</div>
      <div class="eyebrow">Field Reports</div>
      ${forms[mode]}
    </div>`;
    const first = panel.querySelector('input'); if (first) first.focus();
  }
  async function onSubmit(e) {
    e.preventDefault();
    const form = e.target.dataset.form, btn = e.target.querySelector('button[type="submit"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Working…'; }
    try {
      if (form === 'signin') {
        const { data, error } = await sb.auth.signInWithPassword({ email: panel.querySelector('#au-email').value.trim(), password: panel.querySelector('#au-pw').value });
        if (error) return showPanel('signin', { err: true, text: 'Email or password is incorrect. Ask whoever manages Supabase to check your account.' });
        session = data.session; enter();
      } else if (form === 'forgot') {
        const { error } = await sb.auth.resetPasswordForEmail(panel.querySelector('#au-email2').value.trim(), { redirectTo: location.origin + location.pathname });
        showPanel('forgot', error ? { err: true, text: 'The email didn\'t send. Wait a few minutes and try again.' } : { text: 'Check your inbox for the reset link.' });
      } else if (form === 'setpw') {
        const { error } = await sb.auth.updateUser({ password: panel.querySelector('#au-new').value });
        if (error) return showPanel('setpw', { err: true, text: error.message || 'That password wasn\'t accepted. Try a longer one.' });
        needPassword = false; enter();
      }
    } catch (err) {
      showPanel(form === 'forgot' ? 'forgot' : form, { err: true, text: 'Couldn\'t reach Supabase. Check your connection and the values in config.js.' });
    }
  }

  // ---------- header: who is signed in, sign out, import ----------
  function updateHeader() {
    const bar = document.querySelector('.bar-in'); if (!bar || !session) return;
    let box = document.getElementById('acct');
    if (!box) {
      box = document.createElement('div'); box.id = 'acct';
      box.style.cssText = 'display:flex;align-items:center;gap:8px;min-width:0';
      box.innerHTML = `<button class="btn sm" id="import-btn" hidden>Import report</button>
        <span class="hint" id="acct-email" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
        <button class="btn sm ghost" id="signout-btn">Sign out</button>`;
      const newBtn = document.getElementById('newBtn');
      bar.insertBefore(box, newBtn);
      box.querySelector('#signout-btn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
      box.querySelector('#import-btn').addEventListener('click', importDialog);
    }
    box.querySelector('#acct-email').textContent = session.user.email || '';
    box.querySelector('#import-btn').hidden = reportCount !== 0;
  }

  // ---------- one-time import of a report package (report.json + photos) ----------
  function importDialog() {
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">
      <h4>Import a report</h4>
      <p>Select <b>all</b> the files in the import folder: <b>report.json</b> and every photo.</p>
      <input type="file" id="imp-files" multiple accept=".json,image/*,application/pdf">
      <p class="muted" id="imp-msg" style="margin:0;font-size:14px"></p>
      <div class="actions"><button class="btn" data-x="close">Cancel</button><button class="btn primary" data-x="go">Import</button></div>
    </div>`;
    document.body.appendChild(o);
    const msg = (t, err) => { const m = o.querySelector('#imp-msg'); m.textContent = t; m.className = err ? 'err' : 'muted'; };
    o.addEventListener('click', async (e) => {
      const x = e.target.closest('[data-x]'); if (!x) return;
      if (x.dataset.x === 'close') return o.remove();
      const files = Array.from(o.querySelector('#imp-files').files || []);
      const jsonFile = files.find((f) => /\.json$/i.test(f.name));
      if (!jsonFile) return msg('Include report.json in your selection.', true);
      let pkg;
      try { pkg = JSON.parse(await jsonFile.text()); } catch (err) { return msg('report.json couldn\'t be read.', true); }
      if (!pkg || pkg.format !== 'smbm-field-report-import-v1' || !pkg.data) return msg('This isn\'t a field report import file.', true);
      x.disabled = true;
      const data = JSON.parse(JSON.stringify(pkg.data));
      const photos = (data.items || []).flatMap((i) => i.photos || []);
      let done = 0, missing = 0;
      for (const it of data.items || []) {
        const kept = [];
        for (const p of it.photos || []) {
          const f = files.find((ff) => ff.name === (p.importFile || p.name));
          if (!f) { missing++; continue; }
          msg(`Uploading photos (${++done} of ${photos.length})…`);
          const type = /\.pdf$/i.test(f.name) ? 'application/pdf' : (f.type || 'image/jpeg');
          const r = await assets.upload(f, { type });
          const q = { ...p, id: r.id, size: r.sizeBytes }; delete q.importFile; delete q.original;
          kept.push(q);
        }
        it.photos = kept;
      }
      data.author = session.user.id;
      await reportRef(pkg.id || newId()).set(data);
      o.remove();
      alertBox(`Imported ${data.project || 'the report'} with ${done} photo${done === 1 ? '' : 's'}${missing ? `. ${missing} photo${missing === 1 ? ' was' : 's were'} not in your selection` : ''}.`);
    });
  }
  function alertBox(text) {
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = text;
    document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
  }

  // ---------- start ----------
  let entered = false;
  function enter() {
    if (entered) return; entered = true;
    if (panel) { panel.remove(); panel = null; }
    if (location.hash && /access_token|type=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
    updateHeader();
    sb.channel('smbm-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reports' }, scheduleReports)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, () => deliverSettings())
      .subscribe();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleReports(); });
    setInterval(scheduleReports, 20 * 60e3); // also refreshes photo links before they expire
    readyResolve();
  }
  async function start() {
    if (!configured || !window.supabase) return showPanel('setup');
    sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    sb.auth.onAuthStateChange((event, s) => { session = s || session; if (event === 'PASSWORD_RECOVERY') needPassword = true; });
    const { data } = await sb.auth.getSession();
    session = data.session;
    if (!session) return showPanel('signin');
    if (needPassword || hashType === 'invite' || hashType === 'recovery') return showPanel('setpw');
    enter();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
<script>
(() => {
  'use strict';

        return `<div class="trk-cell c-cf"><span class="trk-lbl">${esc(df.name)}</span>${S.canWrite && f && f.type === 'list' ? cellSelect(report.id, item.key, f, v) : esc(v || '—')}</div>`;
      }).join('')}
      <div class="trk-cell c-proj">${esc(report.project)}${report.projectNo ? `<small>${esc(report.projectNo)}</small>` : ''}</div>
      <div class="trk-cell c-resp"><span class="trk-lbl">Responsible</span>${S.canWrite ? `<select class="cell-sel ${item.responsible ? '' : 'unset'}" data-resp-for="${esc(item.key)}" data-report="${esc(report.id)}" aria-label="Responsible party">${partyOptions(item.responsible || '', report.project).replace('Not assigned', '—')}</select>` : esc(item.responsible || '—')}</div>
      <div class="trk-cell c-created"><span class="trk-lbl">Created</span><span class="mono">${esc(itemCreatedMDY(item) || '—')}</span></div>
      <div class="trk-cell c-last"><span class="trk-lbl">Last report</span><span class="mono">${esc(mdy(report.reportDate))}</span></div>
      <div class="c-status">${statusControl(report.id, item.key, st, true)}</div>
    </div>`;
  }

  function cellSelect(reportId, key, f, v) {
    const opts = [...f.options, ...(v && !f.options.includes(v) ? [v] : [])];
    return `<select class="cell-sel ${v ? '' : 'unset'}" data-cf-set="${esc(f.id)}" data-cf-name="${esc(f.name)}" data-key="${esc(key)}" data-report="${esc(reportId)}" aria-label="${esc(f.name)}"><option value="">—</option>${opts.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  }
  function statusControl(reportId, key, st, latest) {
    if (S.canWrite && latest) return `<select class="status-sel ${st}" data-status-for="${esc(key)}" data-report="${esc(reportId)}" aria-label="Item status">${Object.entries(STATUS).map(([v, l]) => `<option value="${v}" ${v === st ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
    return `<span class="pill ${st}">${STATUS[st]}</span>`;
  }

  function renderReportsTab() {
    const box = $('#tabbody');
    const projects = projectNames();
    if (S.rf.project && !projects.includes(S.rf.project)) S.rf.project = '';
    const q = S.rf.q.trim().toLowerCase();
    const list = S.reports.filter(r => (!S.rf.project || r.project === S.rf.project) && (!q || [r.project, r.projectNo, reportTitle(r), ...(r.items || []).map(i => i.title + ' ' + i.desc + ' ' + (i.note || ''))].join(' ').toLowerCase().includes(q)));
    box.innerHTML = `
      <div class="toolbar">
        <input class="input search" id="rf-q" type="search" placeholder="Search reports…" value="${esc(S.rf.q)}" aria-label="Search reports">
        <select class="input" id="rf-project" aria-label="Filter by project"><option value="">All projects</option>${projects.map(p => `<option ${p === S.rf.project ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select>
      </div>
      ${!S.reports.length ? `<div class="empty"><h3>No reports filed yet</h3><p>File a report after each site meeting.</p>${S.canWrite ? '<button class="btn primary" data-action="new">File the first report</button>' : ''}</div>`
        : !list.length ? `<div class="empty"><h3>No matching reports</h3><p>Nothing matches these filters.</p></div>`
        : `<div class="rows">${list.map(reportRow).join('')}</div>`}`;
    paintNames(box);
  }

  function reportRow(r) {
    const d = parseDate(r.visitDate || r.reportDate), c = itemCounts(r);
    const nPh = (r.items || []).reduce((n, i) => n + (i.photos || []).length, 0);
    return `<button class="row" data-action="open" data-id="${esc(r.id)}">
      <div class="datecell"><div class="m">${d.toLocaleDateString('en-US', { month: 'short' })}</div><div class="d">${d.getDate()}</div><div class="y">${d.getFullYear()}</div></div>
      <div class="row-main">
        <div class="row-proj">${esc(r.project || 'Untitled project')}</div>
        <div class="row-meta">${esc(reportTitle(r))}${r.projectNo ? ' · ' + esc(r.projectNo) : ''}${r.revision && r.revision !== 'n/a' ? ' · Rev ' + esc(r.revision) : ''} · <span data-uid="${esc(r.author || '')}">…</span>${nPh ? ` · ${nPh} photo${nPh > 1 ? 's' : ''}` : ''}</div>
      </div>
      <div class="row-side">${c.open ? `<span class="pill open">${c.open} open</span>` : ''}${c.pending ? `<span class="pill pending">${c.pending} pending</span>` : ''}${c.closed ? `<span class="pill closed">${c.closed} closed</span>` : ''}${!(r.items || []).length ? '<span class="pill none">No items</span>' : ''}</div>
    </button>`;
  }

  // ---------- item history overlay ----------
  function itemOverlay(key) {
    const c = S.current.get(key); if (!c) return;
    if (S.canWrite) return itemEditor(c);
    const { item, report } = c, st = normStatus(item.status);
    const entries = [...(item.updates || []).map(u => ({ date: u.date, note: u.note, status: u.status, reportId: u.reportId }))];
    if (item.note) entries.push({ date: report.visitDate || report.reportDate, note: item.note, status: st, reportId: report.id });
    const lbKey = 'ov-' + key; S.lb[lbKey] = (item.photos || []).filter(p => p.kind !== 'pdf');
    const fs = fieldsFor(report.project).filter(f => fieldVal(item, f));
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="dialog wide" role="dialog" aria-modal="true">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
        <div><div class="eyebrow">${esc(report.project)}${report.projectNo ? ' · ' + esc(report.projectNo) : ''}</div><h4>Item ${item.num ? pad2(item.num) : ''} · ${esc(item.title || 'Untitled')}</h4></div>
        <div style="display:flex;gap:8px;align-items:center">${item.critical ? '<span class="pill crit">Critical</span>' : ''}<span class="pill ${st}">${STATUS[st]}</span></div>
      </div>
      <div class="it-desc ${item.critical ? 'crit-text' : ''}">${richHTML(item.desc)}</div>
      ${item.responsible || fs.length ? `<div class="muted" style="font-size:14px">${[item.responsible ? 'Responsible: ' + esc(item.responsible) : '', ...fs.map(f => esc(f.name) + ': ' + esc(fieldVal(item, f)))].filter(Boolean).join(' · ')}</div>` : ''}
      <div><div class="eyebrow" style="margin-bottom:4px">Updates</div>
        ${entries.length ? `<div class="tl">${entries.slice().reverse().map(e => `<div class="tl-e"><div class="d">${esc(mdy(e.date))}<br>${e.status ? `<span class="pill ${normStatus(e.status)}" style="margin-top:4px">${STATUS[normStatus(e.status)]}</span>` : ''}</div><div class="t">${richHTML(e.note)}</div></div>`).join('')}</div>` : '<p class="muted" style="margin:0;font-size:14px">No updates since the item was logged.</p>'}
      </div>
      ${(item.photos || []).length ? `<div><div class="eyebrow" style="margin-bottom:4px">Photos &amp; markups</div>${photosHTML(item.photos, lbKey)}</div>` : ''}
      <div class="actions"><button class="btn" data-x="report">Open latest report (${esc(mdy(report.reportDate))})</button><button class="btn primary" data-x="close">Close</button></div>
    </div>`;
    const close = () => { if (!o.isConnected) return; o.remove(); document.removeEventListener('keydown', onKey); if (S.view !== 'form') render(); };
    const onKey = (e) => { if (e.key === 'Escape' && !$('.lb')) close(); };
    o.addEventListener('click', (e) => {
      const x = e.target.closest('[data-x]');
      if (x) { close(); if (x.dataset.x === 'report') go('detail', report.id); }
      else if (e.target === o) close();
    });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(o);
  }

  // Edit an item where it currently lives (its latest report) without opening the whole report.
  function itemEditor({ item, report }) {
    const copy = JSON.parse(JSON.stringify(item));
    Object.assign(copy, { status: normStatus(copy.status), fields: copy.fields || {}, photos: copy.photos || [], updates: copy.updates || [], note: copy.note || '', carried: true });
    S.itemEdit = { item: copy, reportId: report.id }; S.sessionUploads = new Set();
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="dialog wide" role="dialog" aria-modal="true" aria-label="Edit item">
      <div><div class="eyebrow">${esc(report.project)}${report.projectNo ? ' · ' + esc(report.projectNo) : ''} · created ${esc(itemCreatedMDY(item) || '—')} · latest report ${esc(mdy(report.reportDate))}</div><h4>Edit item${item.num ? ' ' + pad2(item.num) : ''}</h4></div>
      ${itemCardHTML(copy, { project: report.project, overlay: true, noteLabel: `Update in the ${mdy(report.reportDate)} report` })}
      <div class="actions" style="justify-content:space-between">
        <button class="btn ghost" data-x="report">Open latest report</button>
        <span style="display:flex;gap:8px"><button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="save">Save changes</button></span>
      </div>
    </div>`;
    const close = async (discard) => {
      if (!o.isConnected) return;
      if (discard) discardUploads([...S.sessionUploads]);
      o.remove(); document.removeEventListener('keydown', onKey);
      S.itemEdit = null; S.sessionUploads = new Set();
      if (S.view !== 'form') render();
    };
    const onKey = (e) => { if (e.key === 'Escape' && !$('.lb') && !$('.mk') && o === $$('.overlay').pop()) close(true); };
    o.addEventListener('click', async (e) => {
      const x = e.target.closest('[data-x]'); if (!x || !o.contains(x)) return;
      if (x.dataset.x === 'cancel') close(true);
      else if (x.dataset.x === 'report') { close(true); go('detail', report.id); }
      else if (x.dataset.x === 'save') {
        if (S.pending.some(p => p.key === copy.key)) { toast('Wait for uploads to finish.'); return; }
        x.disabled = true; x.textContent = 'Saving…';
        const photos = copy.photos.map(p => { const q = { id: p.id, kind: p.kind || 'image', name: p.name || '', caption: (p.caption || '').trim(), size: p.size || 0 }; if (p.original) q.original = p.original; if (p.addedAt) q.addedAt = p.addedAt; if (p.markedAt) q.markedAt = p.markedAt; return q; });
        const fields = Object.fromEntries(Object.entries(copy.fields || {}).filter(([, v]) => typeof v === 'string' && v.trim()).map(([k, v]) => [k, v.trim()]));
        const ok = await updateItem(report.id, copy.key, {
          title: (copy.title || '').trim(), desc: (copy.desc || '').trim(), critical: !!copy.critical, responsible: (copy.responsible || '').trim(),
          status: normStatus(copy.status), note: (copy.note || '').trim(), fields, photos
        }, 'Item saved');
        if (!ok) { x.disabled = false; x.textContent = 'Save changes'; return; }
        const kept = new Set(); photos.forEach(p => { kept.add(p.id); if (p.original) kept.add(p.original); });
        discardUploads([...S.sessionUploads].filter(id => !kept.has(id)));
        S.sessionUploads = new Set();
        close(false);
      }
    });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(o);
    const t = $('input[data-f="title"]', o); if (t) t.focus();
  }

  function photosHTML(list, lbKey) {
    const imgs = list.filter(p => p.kind !== 'pdf'), docs = list.filter(p => p.kind === 'pdf');
    return `<div class="it-photos">${imgs.map((p, k) => `<div class="it-ph">${p.caption ? `<span class="lab">${esc(p.caption)}</span>` : ''}<button data-action="lightbox" data-lb="${esc(lbKey)}" data-k="${k}" aria-label="Open photo">${p.original ? '<span class="tag">Marked up</span>' : ''}<img src="${blobUrl(p.id)}" alt="${esc(p.caption || 'Item photo')}" loading="lazy" onerror="this.style.visibility='hidden'"></button>${photoWhen(p) ? `<span class="ph-when">${esc(photoWhen(p))}</span>` : ''}</div>`).join('')}
      ${docs.map(p => `<a class="it-pdf" href="${blobUrl(p.id)}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l5 5v13H7z" stroke="currentColor" stroke-width="1.8"/></svg>${esc(p.caption || p.name || 'Document')}</a>`).join('')}</div>`;
  }

  // ---------- report detail ----------
  function renderDetail() {
    const r = S.reports.find(x => x.id === S.currentId);
    if (!r) { app.innerHTML = `<button class="btn ghost back" data-action="home">← Dashboard</button><div class="empty"><h3>Report not found</h3><p>It may have been deleted by a colleague.</p></div>`; return; }
    const items = (r.items || []).slice().sort((a, b) => (a.num || 999) - (b.num || 999));
    const rfs = fieldsFor(r.project);
    const mine = S.canWrite && (S.isEditor || !r.author || r.author === S.uid);
    app.innerHTML = `
      <button class="btn ghost back" data-action="home">← Dashboard</button>
      <article class="sheet">
        <div class="sheet-run"><span>Studio MBM</span><span>${esc(mdy(r.reportDate))}</span></div>
        <h2>${esc(reportTitle(r))}</h2>
        <dl class="kv">
          <dt>Project</dt><dd>${esc(r.project)}${r.projectNo ? ` <span class="muted mono" style="font-size:13px">${esc(r.projectNo)}</span>` : ''}</dd>
          <dt>Date</dt><dd>${esc(longDate(r.reportDate))}</dd>
          <dt>Site Meeting</dt><dd>${esc(longDate(r.visitDate || r.reportDate))}</dd>
          <dt>Revision</dt><dd>${esc(r.revision || 'n/a')}</dd>
        </dl>
        <p class="disclaim">${esc(DISCLAIMER)}</p>
        <div class="legend"><p>Items requiring correction/action in the field are in <strong>bold</strong>.</p><p>Critical items are in <strong class="crit-text">red</strong>.</p><p>Items from previous Field Reports marked CLOSED are removed from subsequent Field Reports.</p></div>
        ${items.length ? `<div class="rtable-wrap"><table class="rtable"><thead><tr><th>#</th><th>Status</th>${rfs.map(f => `<th class="cf">${esc(f.name)}</th>`).join('')}<th>Date/Description/Photo</th></tr></thead><tbody>
          ${items.map(it => {
            const st = normStatus(it.status), latest = isLatestFor(r.id, it.key), later = S.current.get(it.key);
            const lbKey = 'r-' + it.key; S.lb[lbKey] = (it.photos || []).filter(p => p.kind !== 'pdf');
            return `<tr><td class="n">${it.num || ''}</td><td class="s">${statusControl(r.id, it.key, st, latest)}${!latest && later ? `<div class="later">Now ${esc(STATUS[normStatus(later.item.status)].toLowerCase())} in <button data-action="open" data-id="${esc(later.report.id)}">${esc(mdy(later.report.reportDate))}</button></div>` : ''}</td>
              ${rfs.map(f => `<td class="cf">${S.canWrite && latest && f.type === 'list' ? cellSelect(r.id, it.key, f, fieldVal(it, f)) : esc(fieldVal(it, f))}</td>`).join('')}
              <td><div class="it-title">${esc(it.title || '')}</div>
                <div class="it-desc ${it.critical ? 'crit-text' : ''}">${richHTML(it.desc)}</div>
                ${(it.updates || []).filter(u => u.note).map(u => `<div class="it-upd ${it.critical ? 'crit-text' : ''}"><span class="dt">${esc(mdy(u.date))}</span>${richHTML(u.note)}</div>`).join('')}
                ${it.note ? `<div class="it-upd ${it.critical ? 'crit-text' : ''}"><span class="dt">${esc(mdy(r.visitDate || r.reportDate))}</span>${richHTML(it.note)}</div>` : ''}
                ${it.responsible ? `<div class="muted" style="font-size:12px;margin-top:4px">Responsible: ${esc(it.responsible)}</div>` : ''}
                ${(it.photos || []).length ? photosHTML(it.photos, lbKey) : ''}
              </td></tr>`;
          }).join('')}
        </tbody></table></div>` : '<p class="muted">No items in this report.</p>'}
        <p class="muted" style="font-size:13px;margin:16px 0 0">${r.importedFrom ? `Imported from ${esc(r.importedFrom)}` : `Filed by <span data-uid="${esc(r.author || '')}">…</span>`} · ${esc(fmtStamp(r.createdAt))}${r.updatedAt && r.updatedAt - r.createdAt > 60000 ? ` · Last edited ${esc(fmtStamp(r.updatedAt))}` : ''}</p>
      </article>
      <div class="actions">
        <button class="btn primary" data-action="pdf">Download PDF</button>
        ${mine ? '<button class="btn" data-action="edit">Edit report</button>' : ''}
        ${S.canWrite ? '<button class="btn" data-action="next">Start next report</button>' : ''}
        <button class="btn" data-action="copy">Copy as text</button>
        ${mine ? '<button class="btn red" data-action="delete">Delete</button>' : ''}
      </div>`;
    paintNames(app);
  }

  async function updateItem(reportId, key, patch, msg) {
    const r = S.reports.find(x => x.id === reportId); if (!r) return;
    const items = (r.items || []).map(i => i.key === key ? { ...i, ...patch } : { ...i });
    try { await S.db.collection('reports').doc(r.id).update({ items, updatedAt: Date.now(), updatedBy: S.uid }); toast(msg); return true; }
    catch (e) { writeError(e); if (!document.querySelector('.overlay')) render(); return false; }
  }
  const setItemStatus = (reportId, key, status) => updateItem(reportId, key, { status }, 'Item marked ' + STATUS[status].toLowerCase());

  // ---------- copy as text ----------
  function reportText(r) {
    const cfs = fieldsFor(r.project);
    const L = [`${reportTitle(r)}`, `Project: ${r.project}${r.projectNo ? ' (' + r.projectNo + ')' : ''}`, `Date: ${longDate(r.reportDate)}`, `Site Meeting: ${longDate(r.visitDate || r.reportDate)}`, `Revision: ${r.revision || 'n/a'}`, ''];
    (r.items || []).slice().sort((a, b) => (a.num || 999) - (b.num || 999)).forEach(i => {
      L.push(`${i.num || '-'}. [${STATUS[normStatus(i.status)].toUpperCase()}] ${i.title || ''}${i.critical ? ' (CRITICAL)' : ''}`);
      const meta = [i.responsible ? 'Responsible: ' + i.responsible : '', ...cfs.map(f => fieldVal(i, f) ? f.name + ': ' + fieldVal(i, f) : '')].filter(Boolean);
      if (meta.length) L.push(meta.join(' | '));
      L.push(plain(i.desc));
      (i.updates || []).filter(u => u.note).forEach(u => L.push(`${mdy(u.date)}: ${plain(u.note)}`));
      if (i.note) L.push(`${mdy(r.visitDate || r.reportDate)}: ${plain(i.note)}`);
      L.push('');
    });
    return L.join('\n');
  }
  async function copyText(r) {
    const txt = reportText(r);
    try { await navigator.clipboard.writeText(txt); toast('Report copied. Paste it into an email or message.'); }
    catch (e) {
      const o = document.createElement('div'); o.className = 'overlay';
      o.innerHTML = `<div class="dialog wide"><h4>Copy report text</h4><textarea class="input" id="copy-ta" style="min-height:300px;font-size:13px" readonly>${esc(txt)}</textarea><div class="actions"><button class="btn primary" data-x="close">Done</button></div></div>`;
      o.addEventListener('click', (ev) => { if (ev.target.closest('[data-x]') || ev.target === o) o.remove(); });
      document.body.appendChild(o); const ta = $('#copy-ta', o); ta.focus(); ta.select();
    }
  }

  // ---------- photo viewer ----------
  function lightbox(list, k) {
    if (!list || !list.length) return;
    const o = document.createElement('div'); o.className = 'overlay lb'; o.style.zIndex = 70;
    const draw = () => {
      const a = list[k], when = photoWhen(a);
      o.innerHTML = `<img src="${blobUrl(a.id)}" alt="${esc(a.caption || '')}"><div class="lb-cap">${esc(a.caption || '')}${when ? `<div style="opacity:.75;font-size:13px">${esc(when)}${a.markedAt ? ' · marked up ' + esc(fmtWhen(a.markedAt)) : ''}</div>` : ''}</div>
        <div class="lb-bar">${list.length > 1 ? '<button class="btn sm" data-x="prev">← Prev</button>' : ''}<span class="btn sm" style="cursor:default">${k + 1} / ${list.length}</span>${list.length > 1 ? '<button class="btn sm" data-x="next">Next →</button>' : ''}
        ${a.original ? `<a class="btn sm" href="${blobUrl(a.original)}" target="_blank" rel="noopener">View original</a>` : ''}
        <a class="btn sm" href="${blobUrl(a.id)}" target="_blank" rel="noopener">Full size</a><button class="btn sm" data-x="close">Close</button></div>`;
    };
    const step = (d) => { k = (k + d + list.length) % list.length; draw(); };
    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); };
    const close = () => { o.remove(); document.removeEventListener('keydown', onKey, true); };
    o.addEventListener('click', (e) => { const x = e.target.closest('[data-x]'); if (x) { if (x.dataset.x === 'close') close(); else step(x.dataset.x === 'next' ? 1 : -1); } else if (e.target === o) close(); });
    document.addEventListener('keydown', onKey, true);
    draw(); document.body.appendChild(o);
  }

  // Per-project custom columns: add, rename, reorder, delete; list columns keep their options.
  function columnsDialog(project) {
    const rows = fieldsFor(project).map(f => ({ id: f.id, name: f.name, type: f.type, optionsText: f.options.join('\n') }));
    let respText = partiesFor(project).join('\n');
    const o = document.createElement('div'); o.className = 'overlay';
    const draw = () => {
      o.innerHTML = `<div class="dialog wide" role="dialog" aria-modal="true">
        <div><div class="eyebrow">${esc(project)}</div><h4>Item columns</h4></div>
        <p style="font-size:14px">Columns appear on every item in this project, in the report, the PDF and the dashboard. A list column also gets a dashboard filter.</p>
        <div style="border:1px solid var(--rule);border-radius:8px;padding:12px;display:grid;gap:10px;background:var(--sheet-2)">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><strong>Responsible</strong><span class="hint">Built-in column · pick from a list</span></div>
          <div class="fld"><label for="col-resp">Responsible parties, one per line</label><textarea class="input" id="col-resp" rows="5" placeholder="GC&#10;SMBM&#10;Owner">${esc(respText)}</textarea></div>
        </div>
        <div style="display:grid;gap:12px">${rows.map((r, i) => r.removed ? '' : `
          <div style="border:1px solid var(--rule);border-radius:8px;padding:12px;display:grid;gap:10px">
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
              <div class="fld" style="flex:1 1 200px"><label for="col-n-${i}">Column name</label><input class="input" id="col-n-${i}" data-ci="${i}" data-k="name" value="${esc(r.name)}" placeholder="e.g. Floor Level"></div>
              <div class="fld" style="flex:0 1 170px"><label for="col-t-${i}">Type</label><select class="input" id="col-t-${i}" data-ci="${i}" data-k="type"><option value="list" ${r.type === 'list' ? 'selected' : ''}>Pick from a list</option><option value="text" ${r.type === 'text' ? 'selected' : ''}>Free text</option></select></div>
              <button class="btn sm" data-x="up" data-i="${i}" aria-label="Move column left" ${i === rows.findIndex(x => !x.removed) ? 'disabled' : ''}>←</button>
              <button class="btn sm" data-x="down" data-i="${i}" aria-label="Move column right">→</button>

          </div>`).join('') || '<p class="muted" style="margin:0">This project has no extra columns yet.</p>'}</div>

        <p class="hint" style="margin:0">Deleting a column hides it everywhere. Values already entered stay saved and come back if you add a column with the same name again.</p>
        <div class="actions"><button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="save">Save columns</button></div>
      </div>`;
    };
    const close = () => { o.remove(); document.removeEventListener('keydown', onKey); if (S.view === 'form') renderItemCards(); else render(); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    o.addEventListener('input', (e) => { if (e.target.id === 'col-resp') { respText = e.target.value; return; } const i = e.target.dataset.ci; if (i != null && e.target.dataset.k !== 'type') rows[+i][e.target.dataset.k] = e.target.value; });
    o.addEventListener('change', (e) => { const i = e.target.dataset.ci; if (i != null && e.target.dataset.k === 'type') { rows[+i].type = e.target.value; draw(); } });
    o.addEventListener('click', async (e) => {
      const x = e.target.closest('[data-x]'); if (!x) return;
      const i = +x.dataset.i;
      if (x.dataset.x === 'add') { rows.push({ id: 'f' + uid8(), name: '', type: 'list', optionsText: '' }); draw(); const ins = $$('input[data-k="name"]', o); if (ins.length) ins[ins.length - 1].focus(); }
      else if (x.dataset.x === 'rm') { rows[i].removed = true; draw(); }
      else if (x.dataset.x === 'up' || x.dataset.x === 'down') {
        const live = rows.map((r, k) => k).filter(k => !rows[k].removed); const pos = live.indexOf(i); const to = live[pos + (x.dataset.x === 'up' ? -1 : 1)];
        if (to != null) { const t = rows[i]; rows[i] = rows[to]; rows[to] = t; draw(); }
      }
      else if (x.dataset.x === 'cancel') close();
      else if (x.dataset.x === 'save') {
        const live = rows.filter(r => !r.removed && r.name.trim());
        const names = live.map(r => r.name.trim().toLowerCase());
        if (names.some((n, k) => names.indexOf(n) !== k)) { toast('Two columns have the same name. Rename one.'); return; }
        // Reuse a deleted column's id when its name comes back, so old values reappear.
        const prior = (S.fieldsByProject[project] || []).concat(S.retiredFields && S.retiredFields[project] || []);
        const fields = live.map(r => {
          const name = r.name.trim(), old = prior.find(p => p.name.toLowerCase() === name.toLowerCase() && !live.some(l => l !== r && l.id === p.id));
          const keepId = fieldsFor(project).some(f => f.id === r.id);
          return { id: keepId ? r.id : (old ? old.id : r.id), name, type: r.type,
            options: r.type === 'list' ? r.optionsText.split('\n').map(v => v.trim()).filter((v, k, a) => v && a.indexOf(v) === k) : [] };
        });
        const retired = { ...(S.retiredFields || {}) };
        retired[project] = (retired[project] || []).concat(fieldsFor(project).filter(f => !fields.some(n => n.id === f.id))).filter((f, k, a) => a.findIndex(z => z.id === f.id) === k && !fields.some(n => n.id === f.id));
        x.disabled = true; x.textContent = 'Saving…';
        try {
          const all = { ...S.fieldsByProject, [project]: fields };
          const parties = respText.split('\n').map(v => v.trim()).filter((v, k, a) => v && a.indexOf(v) === k);
          const allParties = { ...S.partiesByProject, [project]: parties };
          await saveSettings({ projectFields: all, retiredFields: retired, projectParties: allParties });
          S.fieldsByProject = all; S.retiredFields = retired; S.partiesByProject = allParties;
          toast('Columns saved for ' + project); close();
        } catch (err) { x.disabled = false; x.textContent = 'Save columns'; writeError(err); }
      }
    });
    document.addEventListener('keydown', onKey);
    draw(); document.body.appendChild(o);
    const first = $('input[data-k="name"]', o) || $('#col-resp', o); if (first) first.focus();
  }

  // ---------- form ----------
  function blankDraft() { return { project: '', projectNo: '', reportDate: todayISO(), visitDate: todayISO(), revision: 'n/a', items: [] }; }
  function blankItem() { return { key: newKey(), num: null, title: '', desc: '', critical: false, responsible: '', status: 'open', note: '', updates: [], photos: [], fields: {}, carried: false, createdAt: new Date().toISOString() }; }
  function saveLocalDraft() {
    if (S.view !== 'form' || S.editingId || !S.draft) return;
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ draft: S.draft, uploads: [...S.sessionUploads], carryInfo: S.carryInfo })); } catch (e) {}
  }
  function clearLocalDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

  // Carry every open/pending item of a project (latest version of each) into the draft.
  function carryForward(project) {
    const d = S.draft;
    d.items = d.items.filter(i => !i.carried);
    S.carryInfo = null;
    if (!project) return;
    const prev = latestReportFor(project, null);
    if (prev && !d.projectNo) d.projectNo = prev.projectNo || '';
    const open = [...S.current.values()].filter(c => c.report.project === project && normStatus(c.item.status) !== 'closed')
      .sort((a, b) => (a.item.num || 999) - (b.item.num || 999));
    const carried = open.map(({ item, report }) => ({
      key: item.key, num: item.num, title: item.title || '', desc: item.desc || '', critical: !!item.critical, responsible: item.responsible || '',
      status: normStatus(item.status), note: '',
      updates: [...(item.updates || []), ...(item.note ? [{ date: report.visitDate || report.reportDate, reportId: report.id, status: normStatus(item.status), note: item.note }] : [])],
      photos: (item.photos || []).map(p => ({ ...p })), fields: { ...(item.fields || {}) }, carried: true, carriedFrom: report.id, createdAt: item.createdAt || null
    }));
    d.items = [...carried, ...d.items];
    if (carried.length) S.carryInfo = { n: carried.length, from: prev ? mdy(prev.reportDate) : '' };
  }

  function startNew(project) {
    S.editingId = null; S.sessionUploads = new Set(); S.pending = []; S.carryInfo = null;
    let restored = null;
    if (!project) { try { restored = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {} }
    if (restored && restored.draft) {
      S.draft = Object.assign(blankDraft(), restored.draft); S.carryInfo = restored.carryInfo || null;
      (restored.uploads || []).forEach(id => S.sessionUploads.add(id));
      go('form'); toast('Restored your unsaved draft');
      return;
    }
    S.draft = blankDraft();
    if (project) { S.draft.project = project; carryForward(project); }
    if (!S.draft.items.length) S.draft.items.push(blankItem());
    go('form');
  }
  function startEdit(r) {
    S.editingId = r.id; S.sessionUploads = new Set(); S.pending = []; S.carryInfo = null;
    const c = JSON.parse(JSON.stringify(r)); delete c.id;
    S.draft = Object.assign(blankDraft(), c);
    S.draft.items = (S.draft.items || []).map(i => Object.assign(blankItem(), i, { createdAt: i.createdAt || null, status: normStatus(i.status), carried: !!(i.updates && i.updates.length) || !!i.carriedFrom }));
    go('form');
  }

  // ---------- uploads ----------
  async function prepareImage(file) {
    let src, w, h, revoke = null;
    try { src = await createImageBitmap(file); w = src.width; h = src.height; }
    catch (e) {
      const url = URL.createObjectURL(file); revoke = url;
      src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('decode')); im.src = url; });
      w = src.naturalWidth; h = src.naturalHeight;
    }
    const s = Math.min(1, MAX_EDGE / Math.max(w, h));
    const cw = Math.round(w * s), ch = Math.round(h * s);
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch); ctx.drawImage(src, 0, 0, cw, ch);
    if (revoke) URL.revokeObjectURL(revoke);
    if (src.close) src.close();
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', 0.85));
  }
  function uploadErr(e, name) {
    const code = e && e.code;
    const m = {
      too_large: `${name} is over 20 MB. Compress or split the PDF and try again.`,
      unsupported_type: `${name} isn't a photo or PDF. Export drawings to PDF first.`,
      quota_or_state: 'Storage for this log is full. Remove old attachments before adding more.',
      rate_limited: 'Too many uploads at once. Wait a moment and add the rest.',
      decode: `${name} couldn't be read as a photo. Try exporting it as JPEG.`,
      not_granted: 'Your access doesn\'t include uploading files.'
    };
    toast(m[code] || `${name} didn't upload. Check your connection and try again.`);
  }
  async function addFiles(files, key) {
    if (!S.assets) return;
    for (const f of files) {
      const p = { tmp: uid8(), name: f.name || 'photo.jpg', key };
      S.pending.push(p); refreshItemPhotos(key);
      try {
        const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '');
        const isImg = (f.type || '').startsWith('image/') || /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(f.name || '');
        let blob, kind, opts;
        if (isPdf) { blob = f; kind = 'pdf'; opts = { type: 'application/pdf' }; }
        else if (isImg) { try { blob = await prepareImage(f); } catch (e) { throw { code: 'decode' }; } kind = 'image'; opts = { type: 'image/jpeg' }; }
        else throw { code: 'unsupported_type' };
        let r;
        try { r = await S.assets.upload(blob, opts); }
        catch (e) { if (e && e.code === 'store_unavailable') { await new Promise(z => setTimeout(z, 1200)); r = await S.assets.upload(blob, opts); } else throw e; }
        S.sessionUploads.add(r.id);
        const it = editableItem(key);

  async function saveForm() {
