  // ---------- PDF export ----------
  /*PDF-BEGIN*/
  function buildFieldReportPdf(JsPDF, R, A) {
    const doc = new JsPDF({ unit: 'pt', format: 'letter', compress: true });
    const W = 612, H = 792, M = 72, CW = W - 2 * M;
    const TOP = 72, BOTTOM = H - 64;
    const INK = [0, 0, 0], RED = [204, 0, 0], GREY = [90, 90, 90];
    const CF = R.columns || [], CFW = 62;
    const COLS = [M, M + 26, M + 96]; CF.forEach(() => COLS.push(COLS[COLS.length - 1] + CFW)); COLS.push(W - M);
    const DI = COLS.length - 2;
    const PAD = 4, FS = 9, LH = 10.6;
    let y = TOP;

    const header = () => {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...INK);
      if (A && A.logo) { const lh = 26; doc.addImage(A.logo.data, 'PNG', M, 24, lh * A.logo.w / A.logo.h, lh, 'smbm-logo', 'FAST'); }
      else doc.text('Studio MBM', M, 44);
      doc.text(R.reportDateMDY, W - M, 44, { align: 'right' });
    };
    const newPage = () => { doc.addPage(); header(); y = TOP; };

    // Rich text: **bold** runs, word-wrapped into lines of {t, b} segments.
    const measure = (t, b, size) => { doc.setFont('helvetica', b ? 'bold' : 'normal'); doc.setFontSize(size); return doc.getTextWidth(t); };
    function wrapRich(text, width, size, forceBold) {
      const out = [];
      String(text || '').replace(/\r/g, '').split('\n').forEach(para => {
        const words = [];
        const re = /\*\*([\s\S]+?)\*\*/g; let last = 0, m;
        const pushRun = (s, b) => s.split(/(\s+)/).forEach(tok => { if (tok && !/^\s+$/.test(tok)) words.push({ t: tok, b: b || !!forceBold }); else if (tok) words.push({ sp: true }); });
        while ((m = re.exec(para))) { pushRun(para.slice(last, m.index), false); pushRun(m[1], true); last = m.index + m[0].length; }
        pushRun(para.slice(last), false);
        let line = [], lw = 0, pendingSpace = false;
        words.forEach(w => {
          if (w.sp) { pendingSpace = line.length > 0; return; }
          const sw = pendingSpace ? measure(' ', false, size) : 0;
          const ww = measure(w.t, w.b, size);
          if (line.length && lw + sw + ww > width) { out.push(line); line = []; lw = 0; }
          else if (pendingSpace && line.length) { line.push({ t: ' ', b: false }); lw += sw; }
          line.push({ t: w.t, b: w.b }); lw += ww; pendingSpace = false;
        });
        out.push(line);
      });
      return out;
    }
    function drawRichLine(line, x, yy, size, color) {
      let cx = x; doc.setTextColor(...color);
      line.forEach(seg => { doc.setFont('helvetica', seg.b ? 'bold' : 'normal'); doc.setFontSize(size); doc.text(seg.t, cx, yy); cx += doc.getTextWidth(seg.t); });
    }
    function paragraph(text, opts) {
      const o = Object.assign({ size: FS, lh: LH, color: INK, x: M, width: CW }, opts || {});
      wrapRich(text, o.width, o.size).forEach(line => { if (y + o.lh > BOTTOM) newPage(); drawRichLine(line, o.x, y + o.size * 0.82, o.size, o.color); y += o.lh; });
    }

    // ---- page 1 heading block ----
    header();
    doc.setFont('helvetica', 'bold'); doc.setFontSize(21); doc.setTextColor(...INK);
    doc.text(R.reportDateMDY + ' Field Report', M, 91);
    y = 104;
    const kv = (k, v) => {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(FS); doc.setTextColor(...INK); doc.text(k, M, y + 8);
      doc.setFont('helvetica', 'normal'); doc.text(String(v || ''), M + 72, y + 8); y += 18;
    };
    kv('Project', R.project); kv('Date', R.reportDateLong); kv('Site Meeting', R.visitDateLong);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(FS); doc.text('Revision', M, y + 8);
    const revX = M + doc.getTextWidth('Revision ') + 1;
    doc.setFont('helvetica', 'normal'); doc.text(String(R.revision || 'n/a'), revX, y + 8); y += 28;
    paragraph(R.disclaimer, { lh: 10 });
    y += 10;
    doc.setDrawColor(...INK); doc.setLineWidth(0.75); doc.line(M, y, W - M, y); y += 6;
    paragraph('Items requiring correction/action in the field are in **bold**.', { lh: 10 });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(FS); doc.setTextColor(...INK);
    doc.text('Critical items are in ', M, y + 7.4); const cx = M + doc.getTextWidth('Critical items are in ');
    doc.setFont('helvetica', 'bold'); doc.setTextColor(...RED); doc.text('red', cx, y + 7.4);
    doc.setTextColor(...INK); doc.text('.', cx + doc.getTextWidth('red'), y + 7.4); y += 10;
    paragraph('Items from previous Field Reports marked CLOSED are removed from subsequent Field Reports.', { lh: 10 });
    y += 26;

    // ---- items table ----
    const cellX = COLS[DI] + PAD, cellW = COLS[DI + 1] - COLS[DI] - 2 * PAD;
    const drawRowFrame = (top, bottom) => { doc.setDrawColor(...INK); doc.setLineWidth(0.6); for (let i = 0; i < COLS.length - 1; i++) doc.rect(COLS[i], top, COLS[i + 1] - COLS[i], bottom - top); };
    // header row
    doc.setFont('helvetica', 'bold'); doc.setFontSize(FS);
    const cfHead = CF.map(c => doc.splitTextToSize(String(c.name || ''), CFW - 2 * PAD));
    const hh = 13 + (Math.max(1, ...cfHead.map(l => l.length)) - 1) * LH; if (y + hh + 40 > BOTTOM) newPage();
    drawRowFrame(y, y + hh);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(FS); doc.setTextColor(...INK);
    doc.text('#', (COLS[0] + COLS[1]) / 2, y + 9.5, { align: 'center' }); doc.text('Status', COLS[1] + PAD, y + 9.5);
    cfHead.forEach((lines, j) => lines.forEach((ln, k) => doc.text(ln, COLS[2 + j] + PAD, y + 9.5 + k * LH)));
    doc.text('Date/Description/Photo', COLS[DI] + PAD, y + 9.5);
    y += hh;

    if (!R.items.length) { drawRowFrame(y, y + 20); doc.setFont('helvetica', 'normal'); doc.text('No items recorded.', cellX, y + 13); y += 20; }

    R.items.forEach(it => {
      const color = it.critical ? RED : INK;
      const blocks = [];
      if (it.title) blocks.push({ kind: 'title', text: it.title });
      wrapRich(it.desc, cellW, FS).forEach(l => blocks.push({ kind: 'line', line: l, color }));
      it.updates.forEach(u => wrapRich(`${u.dateMDY}: ${u.note}`, cellW, FS).forEach(l => blocks.push({ kind: 'line', line: l, color })));
      if (it.responsible) blocks.push({ kind: 'line', line: [{ t: 'Responsible: ' + it.responsible, b: false }], color: GREY });
      it.photos.forEach(p => {
        if (p.caption && p.dateText) {
          const capLines = wrapRich(p.caption, cellW - 90, FS);
          capLines.forEach((l, li) => blocks.push({ kind: 'line', line: l, color: INK, right: li === 0 ? p.dateText : '' }));
        } else if (p.caption) wrapRich(p.caption, cellW, FS).forEach(l => blocks.push({ kind: 'line', line: l, color: INK }));
        else if (p.dateText) blocks.push({ kind: 'line', line: [{ t: '', b: false }], color: INK, right: p.dateText });
        if (p.data) {

        } else if (p.pdfName) blocks.push({ kind: 'line', line: [{ t: 'Attachment: ' + p.pdfName, b: false }], color: GREY });
      });
      if (!blocks.length) blocks.push({ kind: 'line', line: [{ t: '', b: false }], color: INK });

      const firstH = blocks[0].kind === 'img' ? blocks[0].h + 4 : LH;
      if (y + PAD + firstH + PAD > BOTTOM) newPage();
      let segTop = y, first = true;
      const labels = () => {
        doc.setFont('helvetica', 'bold'); doc.setFontSize(FS); doc.setTextColor(...INK);
        doc.text(String(it.num || ''), COLS[0] + PAD, segTop + PAD + 7.6);
        doc.text(it.statusLabel.toUpperCase(), COLS[1] + PAD, segTop + PAD + 7.6);
        doc.setFont('helvetica', 'normal');
        cfVals.forEach((lines, j) => lines.forEach((ln, k) => doc.text(ln, COLS[2 + j] + PAD, segTop + PAD + 7.6 + k * LH)));
      };
      doc.setFont('helvetica', 'normal'); doc.setFontSize(FS);
      const cfVals = CF.map((c, j) => doc.splitTextToSize(String((it.cols || [])[j] || ''), CFW - 2 * PAD));
      const minBody = Math.max(0, ...cfVals.map(l => l.length)) * LH;
      labels(); y += PAD; const bodyTop = y;
      blocks.forEach(b => {
        const h = b.kind === 'img' ? b.h + 3 : LH;
        if (y + h > BOTTOM) { drawRowFrame(segTop, y + PAD); newPage(); segTop = y; first = false; y += PAD; }
        if (b.kind === 'title') {
          doc.setFont('helvetica', 'normal'); doc.setFontSize(FS); doc.setTextColor(...color);
          const t = doc.splitTextToSize(b.text, cellW)[0];
          doc.text(t, cellX, y + 7.6); doc.setDrawColor(...color); doc.setLineWidth(0.5); doc.line(cellX, y + 8.8, cellX + doc.getTextWidth(t), y + 8.8);
          y += LH;
        } else if (b.kind === 'line') {
          drawRichLine(b.line, cellX, y + 7.6, FS, b.color);
          if (b.right) { doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...GREY); doc.text(b.right, cellX + cellW, y + 7.6, { align: 'right' }); }
          y += LH;
        }
        else { doc.addImage(b.data, 'JPEG', cellX, y + 1, b.w, b.h, undefined, 'FAST'); y += h; }
      });
      if (first && y < bodyTop + minBody) y = bodyTop + minBody;
      y += PAD;
      drawRowFrame(segTop, y);
    });

    // ---- footer on every page ----
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i);
      doc.setFontSize(8.5); doc.setTextColor(...INK);
      doc.setFont('helvetica', 'normal'); doc.text('Project: ', M, H - 34);
      doc.setFont('helvetica', 'bold'); doc.text(R.project, M + doc.getTextWidth('Project: ') + 1, H - 34);
      doc.setFont('helvetica', 'normal'); doc.text('Field Report', W / 2, H - 34, { align: 'center' });
      doc.text(String(i), W - M, H - 34, { align: 'right' });
    }
    return doc;
  }
  /*PDF-END*/

  async function loadForPdf(id) {
    const img = await new Promise((res) => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = () => res(null); im.src = blobUrl(id); });
    if (!img || !img.naturalWidth) return null;
    const s = Math.min(1, 1500 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    return { data: c.toDataURL('image/jpeg', 0.82), w: c.width, h: c.height };
  }

  async function logoPng() {
    try {
      const w = 852, h = 390;
      const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(logoSvg('#293d9a', `width="${w}" height="${h}"`)); });
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      return { data: c.toDataURL('image/png'), w, h };
    } catch (e) { return null; }
  }

  async function exportPdf(r) {
    if (!window.jspdf || !window.jspdf.jsPDF) { toast('The PDF tool didn\'t load. Reload the page and try again.'); return; }
    if (!S.downloads) { toast('The download didn\'t start. Try again in Chrome or Safari.'); return; }
    const items = (r.items || []).slice().sort((a, b) => (a.num || 999) - (b.num || 999));
    const photoTotal = items.reduce((n, i) => n + (i.photos || []).filter(p => p.kind !== 'pdf').length, 0);
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="dialog prog"><h4>Building PDF</h4><p id="pg-t">Preparing ${photoTotal} photo${photoTotal === 1 ? '' : 's'}…</p><div class="bar2"><i id="pg-b"></i></div></div>`;
    document.body.appendChild(o);
    try {
      let done = 0;
      const R = {
        project: r.project || '', reportDateMDY: mdy(r.reportDate), reportDateLong: longDate(r.reportDate), visitDateLong: longDate(r.visitDate || r.reportDate),
        revision: r.revision || 'n/a', disclaimer: DISCLAIMER, items: [], columns: fieldsFor(r.project).map(f => ({ name: f.name }))
      };
      const cfs = fieldsFor(r.project);
      const logo = await logoPng();
      for (const it of items) {
        const photos = [];
        for (const p of (it.photos || [])) {
          if (p.kind === 'pdf') { photos.push({ caption: p.caption, pdfName: p.name || 'document.pdf' }); continue; }
          const im = await loadForPdf(p.id);
          done++; $('#pg-t', o).textContent = `Preparing photos (${done} of ${photoTotal})…`; $('#pg-b', o).style.width = Math.round(done / Math.max(1, photoTotal) * 100) + '%';
          const dt = photoDateMDY(p);
          photos.push(im ? { caption: p.caption, dateText: dt ? 'Uploaded ' + dt : '', ...im } : { caption: (p.caption ? p.caption + ' ' : '') + '[photo unavailable]', dateText: dt ? 'Uploaded ' + dt : '' });
        }
        const st = normStatus(it.status);
        R.items.push({
          num: it.num, status: st, statusLabel: STATUS[st], cols: cfs.map(f => fieldVal(it, f)), title: it.title, desc: it.desc, critical: !!it.critical, responsible: '',
          updates: [...(it.updates || []).filter(u => u.note).map(u => ({ dateMDY: mdy(u.date), note: u.note })), ...(it.note ? [{ dateMDY: mdy(r.visitDate || r.reportDate), note: it.note }] : [])],
          photos
        });
      }
      $('#pg-t', o).textContent = 'Laying out pages…';
      const doc = buildFieldReportPdf(window.jspdf.jsPDF, R, { logo });
      const blob = doc.output('blob');
      const v = parseDate(r.visitDate || r.reportDate);
      const fname = `${(r.projectNo || r.project || 'Project').replace(/[\\/:*?"<>|]+/g, '-')}-SMBM-${pad2(v.getMonth() + 1)}.${pad2(v.getDate())}.${v.getFullYear()}_Field_Report.pdf`;
      o.remove();
      await S.downloads.save({ filename: fname, data: blob });
      toast('PDF saved');
    } catch (e) {
      o.remove();
      const code = e && e.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') toast('A download prompt is already open. Finish that one first.');
      else if (code === 'unavailable' || code === 'not_granted' || code === 'capability_disabled') toast('The download didn\'t start. Try again in Chrome or Safari.');
      else toast('The PDF couldn\'t be built. Try again, and tell the page owner if it keeps failing.');
    }
  }

  // ---------- events ----------
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-action]'); if (!b) return;
    const a = b.dataset.action;
    const r = S.reports.find(x => x.id === S.currentId);
    const card = b.closest('[data-key].icard');
    const it = card ? editableItem(card.dataset.key) : null;
    if (a === 'home') { if (S.view === 'form') saveLocalDraft(); go('dash'); }
    else if (a === 'tab') { S.tab = b.dataset.tab; persistFilters(); renderDash(); }
    else if (a === 'ifstatus') { S.itf.status = b.dataset.st; persistFilters(); renderItemsTab(); }
    else if (a === 'item') { if (e.target.closest('select')) return; itemOverlay(b.dataset.key); }
    else if (a === 'new') newReportDialog();
    else if (a === 'columns') {
      if (S.view === 'form') collectHead();
      const proj = b.dataset.project || (S.draft && S.draft.project);
      if (!proj) { toast('Enter the project name first. Columns are set per project.'); return; }
      columnsDialog(proj);
    }
    else if (a === 'open') { $$('.overlay').forEach(x => x.remove()); go('detail', b.dataset.id); }
    else if (a === 'edit' && r) startEdit(r);
    else if (a === 'next' && r) { clearLocalDraft(); startNew(r.project); }
    else if (a === 'copy' && r) copyText(r);
    else if (a === 'pdf' && r) exportPdf(r);
    else if (a === 'lightbox') lightbox(S.lb[b.dataset.lb], +b.dataset.k);
    else if (a === 'delete' && r) {
      const ok = await confirmBox('Delete this report?', `${reportTitle(r)} for ${r.project} will be removed for everyone. Items it carried forward go back to their previous report. This can't be undone.`, 'Delete report');
      if (!ok) return;
      try {
        await S.db.collection('reports').doc(r.id).delete();
        const still = referencedIds(r.id), ids = [];
        (r.items || []).forEach(i => (i.photos || []).forEach(p => { [p.id, p.original].forEach(x => { if (x && !still.has(x)) ids.push(x); }); }));
        discardUploads(ids);
        toast('Report deleted'); go('dash');
      } catch (er) { writeError(er); }
    }
    else if (a === 'add-item') { S.draft.items.push(blankItem()); renderItemCards(); const cards = $$('.icard'); const last = cards[cards.length - 1]; if (last) { last.scrollIntoView({ block: 'center', behavior: 'smooth' }); const t = $('input[data-f="title"]', last); if (t) t.focus(); } saveLocalDraft(); }
    else if (a === 'rm-item' && it) {
      const hasContent = (it.desc || '').trim() || (it.photos || []).length;
      if (hasContent && !(await confirmBox(it.carried ? 'Leave this item out?' : 'Remove this item?', it.carried ? 'It stays in the dashboard with its status from the last report.' : 'Its description and photos will be removed from this draft.', it.carried ? 'Leave out' : 'Remove'))) return;
      S.draft.items = S.draft.items.filter(i => i !== it); renderItemCards(); saveLocalDraft();
    }
    else if (a === 'rm-photo' && it) { it.photos.splice(+b.dataset.i, 1); refreshItemPhotos(it.key); saveLocalDraft(); }
    else if (a === 'markup' && it) {
      const i = +b.dataset.i, att = it.photos[i];
      openMarkup(att.id, async (res) => {
        S.sessionUploads.add(res.id);
        it.photos[i] = { ...att, id: res.id, original: att.original || att.id, size: res.sizeBytes, markedAt: new Date().toISOString() };
        refreshItemPhotos(it.key); saveLocalDraft(); toast('Markup added to this item');
      });
    }
    else if (a === 'bold') {
      const ta = document.getElementById(b.dataset.target); if (!ta) return;
      const s = ta.selectionStart, en = ta.selectionEnd;
      if (s === en) { toast('Select the words to bold first.'); ta.focus(); return; }
      const v = ta.value, sel = v.slice(s, en);
      const isB = sel.startsWith('**') && sel.endsWith('**') && sel.length > 4;
      const rep = isB ? sel.slice(2, -2) : '**' + sel.trim() + '**' + (sel.endsWith(' ') ? ' ' : '');
      ta.value = v.slice(0, s) + rep + v.slice(en); ta.focus(); ta.setSelectionRange(s, s + rep.length);
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    }
    else if (a === 'cancel-form') {
      const isEdit = !!S.editingId;
      const ok = await confirmBox(isEdit ? 'Discard your changes?' : 'Discard this draft?', isEdit ? 'The report stays as it was before you started editing.' : 'The draft and any photos you uploaded to it will be removed.', 'Discard');
      if (!ok) return;
      discardUploads([...S.sessionUploads]);
      S.sessionUploads = new Set(); if (!isEdit) clearLocalDraft();
      const back = S.editingId; S.editingId = null; S.draft = null; S.carryInfo = null;
      back ? go('detail', back) : go('dash');
    }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.trk-row')) { e.preventDefault(); itemOverlay(e.target.dataset.key); }
  });
  document.addEventListener('submit', (e) => { if (e.target.id === 'rform') { e.preventDefault(); saveForm(); } });

  let draftTimer = null;
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'if-q') { S.itf.q = t.value; persistFilters(); keepFocus('if-q', renderItemsTab); return; }
    if (t.id === 'rf-q') { S.rf.q = t.value; persistFilters(); keepFocus('rf-q', renderReportsTab); return; }
    const card = t.closest('.icard');
    if (card) {
      const it = editableItem(card.dataset.key); if (!it) return;
      if (t.dataset.f && t.type !== 'checkbox' && t.tagName !== 'SELECT') it[t.dataset.f] = t.value;
      else if (t.dataset.cf && t.tagName !== 'SELECT') { it.fields = it.fields || {}; it.fields[t.dataset.cf] = t.value; }
      else if (t.dataset.cap != null) { const p = it.photos[+t.dataset.cap]; if (p) p.caption = t.value; }
    } else if (S.view === 'form' && S.draft) collectHead();
    else return;
    clearTimeout(draftTimer); draftTimer = setTimeout(saveLocalDraft, 600);
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'if-project') { S.itf.project = t.value; persistFilters(); renderItemsTab(); return; }
    if (t.id === 'if-resp') { S.itf.resp = t.value; persistFilters(); renderItemsTab(); return; }
    if (t.id === 'if-crit') { S.itf.critical = t.checked; persistFilters(); renderItemsTab(); return; }
    if (t.dataset.cfFilter) { if (t.value) S.itf.cf[t.dataset.cfFilter] = t.value; else delete S.itf.cf[t.dataset.cfFilter]; persistFilters(); renderItemsTab(); return; }
    if (t.id === 'rf-project') { S.rf.project = t.value; persistFilters(); renderReportsTab(); return; }
    if (t.dataset.statusFor) { setItemStatus(t.dataset.report, t.dataset.statusFor, t.value); return; }
    if (t.dataset.respFor) { updateItem(t.dataset.report, t.dataset.respFor, { responsible: t.value }, t.value ? 'Assigned to ' + t.value : 'Responsible party cleared'); return; }
    if (t.dataset.cfSet) {
      const c = S.current.get(t.dataset.key); const r = S.reports.find(x => x.id === t.dataset.report);
      const it = r && (r.items || []).find(i => i.key === t.dataset.key);
      if (!it) return;
      const fields = { ...(it.fields || {}), [t.dataset.cfSet]: t.value };
      if (!t.value) delete fields[t.dataset.cfSet];
      updateItem(r.id, it.key, { fields }, t.value ? `${t.dataset.cfName || 'Column'} set to ${t.value}` : `${t.dataset.cfName || 'Column'} cleared`);
      return;
    }
    const card0 = t.closest('.icard');
    if (card0 && S.itemEdit && card0.dataset.key === S.itemEdit.item.key) { applyCardChange(t, card0, S.itemEdit.item); return; }
    if (S.view !== 'form' || !S.draft) return;
    if (t.id === 'p-project' && !S.editingId) {
      collectHead();
      const hadCarry = S.draft.items.some(i => i.carried);
      const onlyBlank = S.draft.items.every(i => i.carried || (!(i.desc || '').trim() && !(i.title || '').trim() && !(i.photos || []).length));
      if (onlyBlank) S.draft.items = S.draft.items.filter(i => i.carried);
      carryForward(S.draft.project);
      if (!S.draft.items.length) S.draft.items.push(blankItem());
      $('#p-no').value = S.draft.projectNo || '';
      renderCarryNote(); renderItemCards(); saveLocalDraft();
      if (S.carryInfo) toast(`Carried forward ${S.carryInfo.n} open item${S.carryInfo.n === 1 ? '' : 's'}`);
      else if (hadCarry) toast('Removed items carried from the other project');
      return;
    }
    const card = t.closest('.icard');
    if (card) {
      const it = S.draft.items.find(i => i.key === card.dataset.key); if (!it) return;
      applyCardChange(t, card, it);
      saveLocalDraft();
    }
  });
  function applyCardChange(t, card, it) {
    if (t.dataset.f === 'critical') { it.critical = t.checked; card.classList.toggle('is-crit', t.checked); }
    else if (t.dataset.f === 'responsible') it.responsible = t.value;
    else if (t.dataset.cf) { it.fields = it.fields || {}; it.fields[t.dataset.cf] = t.value; }
    else if (t.dataset.f === 'status') { it.status = t.value; t.className = 'status-sel ' + t.value; }
    else if (t.dataset.up) { const fs = Array.from(t.files || []); t.value = ''; if (fs.length) addFiles(fs, t.dataset.up); }
  }
  function keepFocus(id, fn) {
    const el = document.getElementById(id), pos = el ? el.selectionStart : null;
    fn(); const n = document.getElementById(id); if (n) { n.focus(); if (pos != null) n.setSelectionRange(pos, pos); }
  }
  ['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, (e) => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d) { e.preventDefault(); d.classList.add('over'); } }));
  document.addEventListener('dragleave', (e) => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('over'); });
  document.addEventListener('drop', (e) => { const d = e.target.closest && e.target.closest('[data-drop]'); if (!d) return; e.preventDefault(); d.classList.remove('over'); const fs = Array.from(e.dataTransfer.files || []); if (fs.length) addFiles(fs, d.dataset.drop); });

  // ---------- boot ----------
  (async () => {
    const use = (n) => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
    const [db, user, assets, downloads] = await Promise.all([use('db'), use('user'), use('assets'), use('downloads')]);
    S.db = db; S.user = user; S.assets = assets; S.downloads = downloads;
    if (!db) { S.dbMissing = true; renderDash(); return; }
    if (user) {
      try { S.uid = await user.id(); } catch (e) {}
      try { const c = await user.can('data.write'); S.canWrite = c !== false; } catch (e) {}
      try { S.isEditor = await user.canEdit(); } catch (e) {}
    }
    db.doc('settings/app').onSnapshot((snap) => {
      const p = snap.exists && snap.data().parties;
      S.parties = Array.isArray(p) ? p.filter(x => typeof x === 'string') : DEFAULT_PARTIES.slice();
      const pp = snap.exists && snap.data().projectParties;
      S.partiesByProject = {};
      if (pp && typeof pp === 'object') Object.entries(pp).forEach(([proj, list]) => { if (Array.isArray(list)) S.partiesByProject[proj] = list.filter(x => typeof x === 'string'); });
      const rf = snap.exists && snap.data().retiredFields;
      S.retiredFields = rf && typeof rf === 'object' ? rf : {};
      const pf = snap.exists && snap.data().projectFields;
      S.fieldsByProject = {};
      if (pf && typeof pf === 'object') Object.entries(pf).forEach(([proj, list]) => {
        if (Array.isArray(list)) S.fieldsByProject[proj] = list.filter(f => f && f.id && f.name).map(f => ({ id: String(f.id), name: String(f.name), type: f.type === 'text' ? 'text' : 'list', options: Array.isArray(f.options) ? f.options.map(String) : [] }));
      });
      if (!S.ready || document.querySelector('.overlay')) return;
      if (S.view === 'dash' && S.tab === 'items') renderItemsTab();
      else if (S.view === 'detail') renderDetail();
      else if (S.view === 'form' && !document.activeElement.closest('.icard')) renderItemCards();
    }, () => {});
    db.collection('reports').orderBy('createdAt', 'desc').limit(1000).onSnapshot((snap) => {
      S.reports = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      derive();
      const first = !S.ready; S.ready = true;
      if (first) $('#newBtn').hidden = !S.canWrite;
      if (S.view !== 'form') {
        if (document.querySelector('.overlay')) return;
        render();
      }
    }, () => {
      app.innerHTML = `<div class="empty"><h3>Reports are unavailable</h3><p>The connection to the report log closed. Reload the page to reconnect.</p></div>`;
    });
  })();
})();
