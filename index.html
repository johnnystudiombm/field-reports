<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Studio MBM Field Reports</title>
<style>
/* Layout: Studio MBM field reports. Logo top-left on a white title bar; the Items page is the workspace (Excel-style grid); reports render on a letter-size sheet identical to the PDF. MBM blue is the accent; redline red marks open and critical items and markups. */
:root {
  --paper: #eff1f6;
  --sheet: #ffffff;
  --sheet-2: #f5f6fa;
  --ink: #1a1f2b;
  --ink-2: #545c6c;
  --ink-3: #8a91a0;
  --rule: #d8dce6;
  --rule-strong: #bcc2d0;
  --mbm: #293d9a;
  --mbm-ink: #ffffff;
  --mbm-soft: #e7eaf7;
  --redline: #cf2f25;
  --redline-soft: #fbe6e4;
  --amber: #a5650c;
  --amber-soft: #fbefd9;
  --green: #2a7748;
  --green-soft: #e0f1e6;
  --shadow: 0 1px 2px rgba(20, 28, 60, .06), 0 6px 20px rgba(20, 28, 60, .06);
  --scrim: rgba(12, 15, 26, .72);
  --f-display: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --f-body: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --f-mono: Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10131b; --sheet: #181c27; --sheet-2: #1e2330; --ink: #e6e9f0; --ink-2: #a2a9b8; --ink-3: #6f7686;
    --rule: #2a3040; --rule-strong: #3a4256; --mbm: #93a5f5; --mbm-ink: #10142a; --mbm-soft: #1e2645;
    --redline: #ff6a5e; --redline-soft: #3b1c1a; --amber: #e6ae55; --amber-soft: #352914; --green: #62c38b; --green-soft: #16301f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.8); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10131b; --sheet: #181c27; --sheet-2: #1e2330; --ink: #e6e9f0; --ink-2: #a2a9b8; --ink-3: #6f7686;
  --rule: #2a3040; --rule-strong: #3a4256; --mbm: #93a5f5; --mbm-ink: #10142a; --mbm-soft: #1e2645;
  --redline: #ff6a5e; --redline-soft: #3b1c1a; --amber: #e6ae55; --amber-soft: #352914; --green: #62c38b; --green-soft: #16301f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.8); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mbm); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Title bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.bar-in { max-width: 1360px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; background: none; border: 0; padding: 0; cursor: pointer; color: var(--mbm); }
.brand svg { height: 34px; width: auto; display: block; flex: none; }
.brand .div { width: 1px; height: 28px; background: var(--rule-strong); }
.brand .lbl { font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.bar .spacer { flex: 1; }
@media (max-width: 520px) { .brand .div, .brand .lbl { display: none; } }

.wrap { max-width: 1360px; margin: 0 auto; padding-block: 20px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--rule-strong); background: var(--sheet); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--mbm); color: var(--mbm-ink); border-color: var(--mbm); }
.btn.primary:hover { opacity: .92; }
.btn.red { color: var(--redline); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--sheet-2); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }

.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
h2.view-title { font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1.05; margin: 0; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.muted { color: var(--ink-2); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin: 14px 0 16px; }
.tab { background: none; border: 0; padding: 10px 14px; font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--mbm); }
.tab .n { font-family: var(--f-mono); font-size: 12px; font-weight: 400; color: var(--ink-3); margin-left: 4px; }

/* Status chips (filters) */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet); cursor: pointer; text-align: left; }
.chip .k { font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.chip .k::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.chip.open .k::before { background: var(--redline); }
.chip.pending .k::before { background: var(--amber); }
.chip.closed .k::before { background: var(--green); }
.chip .v { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--mbm); box-shadow: 0 0 0 1px var(--mbm) inset; background: var(--mbm-soft); }

/* Filters */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 14px; }
.input, select.input, textarea.input { width: 100%; min-height: 40px; padding: 8px 11px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--sheet); }
textarea.input { min-height: 88px; resize: vertical; line-height: 1.5; }
.input::placeholder { color: var(--ink-3); }
.toolbar .search { flex: 1 1 220px; min-width: 0; }
.toolbar select { flex: 0 1 200px; width: auto; min-width: 0; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.check input { width: 16px; height: 16px; accent-color: var(--redline); }
.tally { font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }

/* Items tracker */
.trk { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.trk { overflow-x: auto; }
.trk-head, .trk-row { display: grid; grid-template-columns: var(--trk-cols, 52px minmax(0, 1fr) 150px 110px 100px 112px); gap: 14px; min-width: 760px; align-items: start; padding: 12px 16px; }
.trk-head { background: var(--sheet-2); border-bottom: 1px solid var(--rule); font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding-block: 9px; }
.trk-row { border-bottom: 1px solid var(--rule); cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.trk-row:last-child { border-bottom: 0; }
.trk-row:hover { background: var(--sheet-2); }
.trk-num { font-family: var(--f-display); font-weight: 700; font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; }
.trk-title { font-weight: 600; text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
.trk-desc { font-size: 14px; color: var(--ink-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.trk-desc.crit, .crit-text { color: var(--redline); }
.trk-upd { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.trk-upd b { font-family: var(--f-mono); font-weight: 500; font-size: 12px; color: var(--ink-3); }
.trk-cell { font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.trk-cell small { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.trk-lbl { display: none; }
@media (max-width: 860px) {
  .trk-head { display: none; }
  .trk-head, .trk-row { min-width: 0; }
  .trk-row { grid-template-columns: 44px minmax(0, 1fr) auto; gap: 6px 12px; }
  .trk-row .c-cf, .trk-row .c-created { grid-column: 1 / -1; }
  .trk-row .trk-num { grid-row: 1; grid-column: 1; }
  .trk-row .c-proj { grid-row: 1; grid-column: 2; align-self: center; }
  .trk-row .c-status { grid-row: 1; grid-column: 3; justify-self: end; }
  .trk-row .c-main { grid-row: 2; grid-column: 1 / -1; }
  .trk-row .c-resp { grid-row: 3; grid-column: 1 / 3; }
  .trk-row .c-last { grid-row: 3; grid-column: 3; justify-self: end; }
  .trk-lbl { display: inline; color: var(--ink-3); font-size: 12px; margin-right: 4px; }
}

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.open { color: var(--redline); background: var(--redline-soft); }
.pill.pending { color: var(--amber); background: var(--amber-soft); }
.pill.closed { color: var(--green); background: var(--green-soft); }
.pill.none { color: var(--ink-3); background: var(--sheet-2); }
.pill.crit { color: var(--redline); background: transparent; border: 1px solid var(--redline); }
.pill.crit::before { display: none; }
.status-sel { border: 1px solid var(--rule-strong); border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; background: var(--sheet); cursor: pointer; }
.cell-sel { border: 1px solid var(--rule-strong); border-radius: 6px; padding: 4px 6px; font-size: 13px; background: var(--sheet); cursor: pointer; max-width: 100%; color: var(--ink); }
.cell-sel.unset { color: var(--ink-3); border-style: dashed; }
.cell-sel:hover { border-color: var(--mbm); }
.status-sel.open { color: var(--redline); border-color: var(--redline); }
.status-sel.pending { color: var(--amber); border-color: var(--amber); }
.status-sel.closed { color: var(--green); border-color: var(--green); }

/* Report list */
.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; text-align: left; width: 100%; }
.row:hover { border-color: var(--rule-strong); box-shadow: var(--shadow); }
.datecell { text-align: center; border-right: 1px solid var(--rule); padding-right: 14px; }
.datecell .m { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }
.datecell .d { font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1; }
.datecell .y { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.row-main { min-width: 0; }
.row-proj { font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.15; }
.row-meta { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.row-side { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
@media (max-width: 560px) {
  .row { grid-template-columns: 52px minmax(0, 1fr); gap: 12px; padding: 12px; }
  .row-side { grid-column: 1 / -1; justify-content: flex-start; }
  .datecell { padding-right: 10px; }
}

.empty { background: var(--sheet); border: 1px dashed var(--rule-strong); border-radius: 8px; padding: 36px 20px; text-align: center; }
.empty h3 { font-family: var(--f-display); font-size: 17px; text-transform: uppercase; margin: 0 0 6px; }
.empty p { margin: 0 auto 16px; max-width: 48ch; color: var(--ink-2); }
.notice { padding: 10px 14px; border-radius: 6px; background: var(--mbm-soft); color: var(--ink); font-size: 14px; margin-bottom: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }

/* Report sheet (mirrors the PDF) */
.back { margin-bottom: 14px; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: clamp(18px, 4vw, 44px); }
.sheet-run { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 18px; gap: 12px; }
.sheet h2 { font-family: var(--f-body); font-weight: 700; font-size: clamp(24px, 4vw, 30px); margin: 0 0 12px; line-height: 1.15; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; font-size: 14px; margin-bottom: 18px; }
.kv dt { font-weight: 700; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.disclaim { font-size: 13px; color: var(--ink-2); max-width: 90ch; margin: 0 0 14px; }
.legend { border-top: 1px solid var(--ink); padding-top: 10px; font-size: 13px; margin-bottom: 18px; }
.legend p { margin: 0; }
.rtable-wrap { overflow-x: auto; }
table.rtable { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
table.rtable th, table.rtable td { border: 1px solid var(--ink); padding: 6px 8px; vertical-align: top; text-align: left; }
table.rtable th { font-weight: 700; }
table.rtable td.n { width: 44px; font-weight: 700; }
table.rtable td.s { width: 120px; }
table.rtable td.cf { width: 96px; }
.it-title { text-decoration: underline; text-underline-offset: 2px; }
.it-desc { white-space: pre-wrap; overflow-wrap: anywhere; }
.it-desc strong { font-weight: 700; }
.it-upd { margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.it-upd .dt { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); margin-right: 6px; }
.it-photos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.it-ph { display: grid; gap: 3px; width: min(220px, 100%); }
.it-ph .lab { font-size: 13px; }
.it-ph button { display: block; width: 100%; padding: 0; border: 1px solid var(--rule); background: var(--sheet-2); cursor: zoom-in; border-radius: 3px; overflow: hidden; position: relative; aspect-ratio: 4 / 3; max-width: 100%; }
.it-ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.it-ph .tag { z-index: 1; }
.it-ph .tag, .tag { position: absolute; left: 4px; top: 4px; font-family: var(--f-mono); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: rgba(207, 47, 37, .92); padding: 2px 5px; border-radius: 3px; }
.it-ph .ph-when { font-size: 11px; color: var(--ink-3); }
.it-pdf { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mbm); font-weight: 600; }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--sheet); cursor: pointer; color: var(--ink); }
.choice:hover, .choice:focus-visible { border-color: var(--mbm); background: var(--mbm-soft); }
.choice .c-main { display: grid; gap: 2px; flex: 1; min-width: 0; }
.choice .c-sub { font-size: 13px; color: var(--ink-2); }
.choice .c-go { font-size: 18px; color: var(--mbm); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.later { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.later button { background: none; border: 0; padding: 0; color: var(--mbm); text-decoration: underline; cursor: pointer; font-size: 12px; }

/* Form */
.form { display: grid; gap: 20px; }
.fs { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 18px; display: grid; gap: 14px; }
.fs > h3 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center; gap: 10px; }
.fs > h3 .n { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); font-weight: 400; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.fld { display: grid; gap: 5px; min-width: 0; }
.fld label, .fld .lbl-row { font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fld .req { color: var(--redline); }
.hint { font-size: 12px; color: var(--ink-3); }
.err { color: var(--redline); font-size: 13px; }
.bold-btn { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 4px; font-weight: 700; font-size: 12px; padding: 1px 8px; cursor: pointer; color: var(--ink); }
.icards { display: grid; gap: 14px; }
.icard { border: 1px solid var(--rule-strong); border-radius: 8px; padding: 14px; display: grid; gap: 12px; background: var(--sheet); }
.icard.carried { border-left: 4px solid var(--mbm); }
.icard.is-crit { border-color: var(--redline); }
.icard-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.inum { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1; }
.inum small { font-family: var(--f-mono); font-size: 11px; font-weight: 400; color: var(--ink-3); margin-left: 6px; letter-spacing: .04em; }
.icard-head .sp { flex: 1; }
.icard-head .status-sel { padding: 6px 10px; font-size: 13px; }
.hist { background: var(--sheet-2); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; font-size: 14px; }
.hist .h-row { white-space: pre-wrap; overflow-wrap: anywhere; }
.hist .dt { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); margin-right: 6px; }
.ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.att { border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--sheet); display: grid; min-width: 0; }
.att .pv { aspect-ratio: 4 / 3; max-width: 100%; min-height: 0; overflow: hidden; background: var(--sheet-2); display: grid; place-items: center; position: relative; }
.att .pv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.att .pv .tag { z-index: 1; }
.att .pv .pdf { font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--redline); }
.att .body { padding: 8px; display: grid; gap: 6px; }
.att .nm { font-size: 11px; color: var(--ink-3); font-family: var(--f-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .body .input { min-height: 32px; padding: 5px 8px; font-size: 13px; }
.att .row-btns { display: flex; gap: 6px; }
.att .row-btns .btn { flex: 1; padding: 0 6px; }
.att.pending .pv { color: var(--ink-3); font-size: 13px; }
.up-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.up-row.over { outline: 2px dashed var(--mbm); outline-offset: 4px; border-radius: 6px; }
.spin { width: 22px; height: 22px; border: 2px solid var(--rule-strong); border-top-color: var(--mbm); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.form-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--paper) 70%, transparent); }
.icon-btn { width: 34px; height: 34px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { color: var(--redline); border-color: var(--redline); }
.icon-btn svg { width: 16px; height: 16px; }

/* Overlays */

<body>
<header class="bar">
  <div class="bar-in">
    <button class="brand" data-action="home" aria-label="Studio MBM field reports home">
      <span id="logo-slot"></span>
      <span class="div" aria-hidden="true"></span>
      <span class="lbl">Field Reports</span>
    </button>
    <span class="spacer"></span>
  </div>
</header>

<main class="wrap" id="app">
  <div class="empty">
    <h3>Loading field reports</h3>
    <p>Connecting to Studio MBM's shared report log.</p>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
// Studio MBM Field Reports: Supabase connection (login, reports, photos, live updates).
// The app below talks to window.claude.use(...); this file answers those calls with Supabase.
(() => {
  'use strict';
  const cfg = window.SMBM_CONFIG || {};
  const configured = !!(cfg.supabaseUrl && cfg.supabaseAnonKey && !/YOUR[-_]/i.test(cfg.supabaseUrl + cfg.supabaseAnonKey));
  const hashType = new URLSearchParams((location.hash || '').slice(1)).get('type');
  const BUCKET = 'photos';
  let sb = null, session = null, readyResolve, needPassword = false;
  const ready = new Promise((r) => { readyResolve = r; });
  const urlCache = new Map();   // storage path -> { url, exp }
  const people = new Map();     // user id -> email

  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- photo links (private bucket, short-lived signed links) ----------
  window.SMBM_blobUrl = (id) => { const c = urlCache.get(id); return c ? c.url : ''; };
  async function signPaths(paths) {
    const now = Date.now();
    const need = [...new Set(paths.filter(Boolean))].filter((p) => !urlCache.has(p) || urlCache.get(p).exp - now < 30 * 60e3);
    for (let i = 0; i < need.length; i += 100) {
      const chunk = need.slice(i, i + 100);
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(chunk, 6 * 3600);
      if (error || !data) { console.warn('Photo links failed', error); continue; }
      data.forEach((d) => { if (d && d.signedUrl && !d.error) urlCache.set(d.path, { url: d.signedUrl, exp: now + 6 * 3600e3 }); });
    }
  }

  // ---------- helpers ----------
  const dbErr = (error) => ({
    code: error && (error.code === '42501' || /row-level security|permission/i.test(error.message || '')) ? 'invalid_argument' : 'unavailable',
    message: (error && error.message) || 'Request failed'
  });
  function deepMerge(base, patch) {
    const out = { ...(base || {}) };
    Object.entries(patch || {}).forEach(([k, v]) => {
      const cur = out[k];
      out[k] = v && typeof v === 'object' && !Array.isArray(v) && cur && typeof cur === 'object' && !Array.isArray(cur) ? deepMerge(cur, v) : v;
    });
    return out;
  }
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

  // ---------- tables: reports and items (each row = one document) ----------
  const TABLES = ['reports', 'items'];
  const tableListeners = { reports: new Set(), items: new Set() };
  const tableTimers = {};
  const missingTable = (error) => /does not exist|could not find the table|schema cache|42P01|PGRST205/i.test(((error && error.message) || '') + ' ' + ((error && error.code) || ''));
  async function fetchTable(table) {
    const { data, error } = await sb.from(table).select('id,data').order('created_at', { ascending: false }).limit(5000);
    if (error) throw error;
    const paths = [];
    data.forEach((row) => {
      const d = row.data || {};
      if (d.author && d.authorEmail) people.set(d.author, d.authorEmail);
      (d.photos || []).forEach((p) => { if (p) { paths.push(p.id); if (p.original) paths.push(p.original); } });
      (d.items || []).forEach((i) => (i.photos || []).forEach((p) => { paths.push(p.id); if (p.original) paths.push(p.original); }));
    });
    await signPaths(paths);
    return { docs: data.map((row) => ({ id: row.id, exists: true, data: () => row.data || {}, metadata: { fromCache: false, hasPendingWrites: false } })), size: data.length, empty: !data.length };
  }
  async function deliverTable(table) {
    try { const snap = await fetchTable(table); tableListeners[table].forEach((l) => l.next(snap)); }
    catch (e) {
      console.warn('Loading ' + table + ' failed', e);
      if (missingTable(e)) tableListeners[table].forEach((l) => { if (!l.failed && l.err) { l.failed = true; l.err({ code: 'missing_table', message: e.message }); } });
    }
  }
  const scheduleTable = (table) => { clearTimeout(tableTimers[table]); tableTimers[table] = setTimeout(() => deliverTable(table), 200); };
  const scheduleAll = () => TABLES.forEach(scheduleTable);
  function rowRef(table, id) {
    return {
      id, path: table + '/' + id,
      async get() {
        const { data, error } = await sb.from(table).select('id,data').eq('id', id).maybeSingle();
        if (error) throw dbErr(error);
        return { id, exists: !!data, data: () => (data ? data.data : undefined), metadata: {} };
      },
      async set(doc) {
        const data = { ...doc };
        if (data.author && data.author === session.user.id && !data.authorEmail) data.authorEmail = session.user.email;
        const { error } = await sb.from(table).upsert({ id, data });
        if (error) throw dbErr(error);
        scheduleTable(table);
      },
      async update(patch) {
        const { data: row, error } = await sb.from(table).select('data').eq('id', id).maybeSingle();
        if (error) throw dbErr(error);
        if (!row) throw { code: 'invalid_argument', message: 'Not found' };
        const { error: e2 } = await sb.from(table).update({ data: deepMerge(row.data, patch) }).eq('id', id);
        if (e2) throw dbErr(e2);
        scheduleTable(table);
      },
      async delete() {
        const { error } = await sb.from(table).delete().eq('id', id);
        if (error) throw dbErr(error);
        scheduleTable(table);
      }
    };
  }
  const tableQuery = (table) => ({
    onSnapshot(next, err) { const l = { next, err }; tableListeners[table].add(l); deliverTable(table); return () => tableListeners[table].delete(l); }
  });

  // ---------- settings ----------
  const settingsListeners = new Set();
  async function fetchSettings(id) {
    const { data, error } = await sb.from('settings').select('id,data').eq('id', id).maybeSingle();
    if (error) throw dbErr(error);
    return { id, exists: !!data, data: () => (data ? data.data : undefined), metadata: {} };
  }
  async function deliverSettings() { try { const s = await fetchSettings('app'); settingsListeners.forEach((l) => l(s)); } catch (e) { console.warn(e); } }
  function settingsRef(id) {
    return {
      id, path: 'settings/' + id,
      onSnapshot(next) { settingsListeners.add(next); fetchSettings(id).then(next).catch(() => {}); return () => settingsListeners.delete(next); },
      get: () => fetchSettings(id),
      async set(doc) { const { error } = await sb.from('settings').upsert({ id, data: doc }); if (error) throw dbErr(error); deliverSettings(); },
      async update(patch) {
        const cur = await fetchSettings(id);
        const { error } = await sb.from('settings').upsert({ id, data: deepMerge(cur.exists ? cur.data() : {}, patch) });
        if (error) throw dbErr(error);
        deliverSettings();
      }
    };
  }

  const db = {
    collection(name) {
      if (!TABLES.includes(name)) throw new TypeError('Unknown collection ' + name);

    doc(path) { return settingsRef(String(path).split('/')[1] || 'app'); }

      const ext = type === 'application/pdf' ? 'pdf' : type === 'image/png' ? 'png' : type === 'image/webp' ? 'webp' : 'jpg';

      const path = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${newId()}.${ext}`;
      const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: type, upsert: false });

        const m = String(error.message || '');
        throw { code: /size|large|exceed/i.test(m) ? 'too_large' : /mime|type/i.test(m) ? 'unsupported_type' : 'upstream_error', message: m };

      await signPaths([path]);
      return { id: path, url: window.SMBM_blobUrl(path), sizeBytes: blob.size, contentType: type };

  // Column resizing (pointer drag on a header edge), saved per browser.
  let rsState = null;
  document.addEventListener('pointerdown', (e) => {
    const h = e.target.closest && e.target.closest('[data-resize]'); if (!h) return;
    e.preventDefault(); e.stopPropagation();
    const table = h.closest('table'), col = table.querySelector(`col[data-col="${CSS.escape(h.dataset.resize)}"]`);
    rsState = { key: h.dataset.resize, col, table, x: e.clientX, w: col.getBoundingClientRect().width || parseFloat(col.style.width), tw: table.getBoundingClientRect().width, h };
    h.classList.add('active'); h.setPointerCapture && h.setPointerCapture(e.pointerId);
  });
  document.addEventListener('pointermove', (e) => {
    if (!rsState) return;
    const w = Math.max(40, Math.round(rsState.w + e.clientX - rsState.x));
    rsState.col.style.width = w + 'px'; rsState.table.style.width = (rsState.tw - rsState.w + w) + 'px'; rsState.nw = w;
  });
  document.addEventListener('pointerup', () => {
    if (!rsState) return;
    rsState.h.classList.remove('active');
    if (rsState.nw) { S.prefs.colw[rsState.key] = rsState.nw; savePrefs(); }
    const k = rsState.key; rsState = null;
    window.__lastResize = Date.now(); void k;
  });
  document.addEventListener('dblclick', (e) => {
    const h = e.target.closest && e.target.closest('[data-resize]'); if (!h) return;
    delete S.prefs.colw[h.dataset.resize]; savePrefs(); renderItemsTab();
  });

  async function updateItemFields(id, patch, msg) {
    const it = S.items.find(i => i.id === id); if (!it) return false;
    const next = { ...it, ...patch, updatedAt: nowLocal() };
    if (patch.status === 'closed' && !it.closedAt) next.closedAt = nowLocal();
    if (patch.status === 'open') next.closedAt = '';
    if (patch.level !== undefined && it.room) { const r = findRoom(it.project, it.room); if (r && patch.level && r.level !== patch.level) next.room = ''; }
    if (patch.room) { const r = findRoom(it.project, patch.room); if (r && r.level && !it.level) next.level = r.level; }
    try { await S.db.collection('items').doc(id).set(itemBody(next)); if (msg) toast(msg); return true; }
    catch (e) { writeError(e); render(); return false; }
  }

  // ---------- item editor ----------
  function openItem(id, project) {
    S.back = { view: S.view, reportId: S.reportId, tab: S.tab };
    S.sessionUploads = new Set(); S.pending = [];
    if (id) {
      const it = S.items.find(i => i.id === id); if (!it) { toast('That item was deleted.'); return; }
      S.draft = JSON.parse(JSON.stringify(it)); S.draftIsNew = false;
    } else {
      const p = project || S.prefs.project || projectNames()[0] || '';
      S.draft = normItem(newKey(), { project: p, num: p ? nextNum(p) : 1, createdAt: nowLocal(), updatedAt: nowLocal(),
        level: S.prefs.project === p ? S.prefs.level : '', room: S.prefs.project === p ? S.prefs.room : '' });
      S.draftIsNew = true;
    }
    S.draft._touchedUpdated = false;
    S.view = 'item'; render(); window.scrollTo(0, 0);
  }
  function goBack() {
    const b = S.back || { view: 'items' };
    S.draft = null; S.view = b.view === 'report' ? 'report' : 'items';
    if (b.tab) S.tab = b.tab;
    render(); window.scrollTo(0, 0);
  }
  function partyChips(d) {

  }
  function levelOptions(d) { const cfg = projCfg(d.project); const l = [...cfg.levels]; if (d.level && !l.includes(d.level)) l.push(d.level); return `<option value="">—</option>` + l.map(x => `<option ${x === d.level ? 'selected' : ''}>${esc(x)}</option>`).join(''); }

  // ---------- uploads ----------
  async function prepareImage(file) {
    let src, w, h, revoke = null;
    try { src = await createImageBitmap(file); w = src.width; h = src.height; }
    catch (e) {
      const url = URL.createObjectURL(file); revoke = url;
      src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('decode')); im.src = url; });
      w = src.naturalWidth; h = src.naturalHeight;
    }
    const s = Math.min(1, MAX_EDGE / Math.max(w, h));
    const cw = Math.round(w * s), ch = Math.round(h * s);
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch); ctx.drawImage(src, 0, 0, cw, ch);
    if (revoke) URL.revokeObjectURL(revoke);
    if (src.close) src.close();
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', 0.85));
  }

  function uploadErr(e, name) {
    const code = e && e.code;
    const m = {
      too_large: `${name} is over 20 MB. Compress or split the PDF and try again.`,
      unsupported_type: `${name} isn't a photo or PDF. Export drawings to PDF first.`,
      quota_or_state: 'Storage for this log is full. Remove old attachments before adding more.',
      rate_limited: 'Too many uploads at once. Wait a moment and add the rest.',
      decode: `${name} couldn't be read as a photo. Try exporting it as JPEG.`,
      not_granted: 'Your access doesn\'t include uploading files.'
    };
    toast(m[code] || `${name} didn't upload. Check your connection and try again.`);
  }

  async function addFiles(files) {
    if (!S.assets || !S.draft) return;
    collectDraft();
    for (const f of files) {
      const p = { tmp: uid8(), name: f.name || 'photo.jpg' };
      S.pending.push(p); refreshEd('e-photos', photosEditHTML(S.draft));
      try {
        const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '');
        const isImg = (f.type || '').startsWith('image/') || /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(f.name || '');
        let blob, kind, opts;
        if (isPdf) { blob = f; kind = 'pdf'; opts = { type: 'application/pdf' }; }
        else if (isImg) { try { blob = await prepareImage(f); } catch (e) { throw { code: 'decode' }; } kind = 'image'; opts = { type: 'image/jpeg' }; }
        else throw { code: 'unsupported_type' };
        let r;
        try { r = await S.assets.upload(blob, opts); }
        catch (e) { if (e && e.code === 'store_unavailable') { await new Promise(z => setTimeout(z, 1200)); r = await S.assets.upload(blob, opts); } else throw e; }
        S.sessionUploads.add(r.id);
        if (S.draft) S.draft.photos.push({ id: r.id, kind, name: kind === 'image' ? (f.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg' : f.name, caption: '', size: r.sizeBytes, addedAt: nowLocal() });
      } catch (e) { uploadErr(e, p.name); }
      S.pending = S.pending.filter(x => x !== p);
      if (S.draft) { collectPhotoInputs(); refreshEd('e-photos', photosEditHTML(S.draft)); }
    }
  }

  // Reads the Studio MBM template workbook: "Room Schedule" (Level, Room #, Room Name) and "Responsible Parties" (Trade, Name).
  function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  async function readTemplateXlsx(file) {
    if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const sheet = (re) => { const n = wb.SheetNames.find(s => re.test(s)); return n ? window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' }) : []; };
    const col = (head, re, dflt) => { const i = head.findIndex(h => re.test(String(h))); return i < 0 ? dflt : i; };
    const out = { levels: [], rooms: [], parties: [] };
    const rs = sheet(/room/i);
    if (rs.length) {
      const h = rs[0], li = col(h, /level|floor/i, 0), ni = col(h, /#|number|no\b/i, 1), mi = col(h, /name/i, 2);
      rs.slice(1).forEach(row => { const level = str(row[li]), number = str(row[ni]), name = str(row[mi]); if (!level && !number && !name) return; if (level && !out.levels.includes(level)) out.levels.push(level); if (number || name) out.rooms.push({ level, number, name }); });
    }
    const ps = sheet(/responsib|part/i);
    if (ps.length) {
      const h = ps[0], ti = col(h, /trade|role/i, 0), ni = col(h, /name|company/i, 1);
      ps.slice(1).forEach(row => { const trade = str(row[ti]), name = str(row[ni]); if (name) out.parties.push({ trade, name }); });
    }
    return out;
  }

  // ---------- PDF export (letter size, same layout as the report view) ----------
  /*PDF-BEGIN*/
  function buildFieldReportPdf(JsPDF, R, A) {
    const doc = new JsPDF({ unit: 'pt', format: 'letter', compress: true });
    const W = 612, H = 792, M = 72, TOP = 72, BOTTOM = H - 64;
    const INK = [0, 0, 0], RED = [204, 0, 0], GREY = [85, 85, 85];
    const COLS = [M, M + 26, M + 96, W - M];
    const PAD = 4, FS = 9, LH = 10.6, PH = 72, PH_MAXH = 108, PH_GAP = 8;
    let y = TOP;
    const header = () => {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...INK);
      if (A && A.logo) { const lh = 26; doc.addImage(A.logo.data, 'PNG', M, 24, lh * A.logo.w / A.logo.h, lh, 'smbm-logo', 'FAST'); }
      else doc.text('Studio MBM', M, 44);
      doc.text(R.reportDateMDY, W - M, 44, { align: 'right' });
    };
    const newPage = () => { doc.addPage(); header(); y = TOP; };
    const fontStyle = (s) => (s.b && s.i ? 'bolditalic' : s.b ? 'bold' : s.i ? 'italic' : 'normal');
    const measure = (t, s, size) => { doc.setFont('helvetica', fontStyle(s)); doc.setFontSize(size); return doc.getTextWidth(t); };
    // lines: [[{t, b, i, u, color, bg}]] -> wrapped visual lines
    function wrapRuns(lines, width, size) {
      const out = [];
      (lines || [[]]).forEach(line => {
        const words = [];
        line.forEach(run => String(run.t || '').split(/(\s+)/).forEach(tok => { if (!tok) return; if (/^\s+$/.test(tok)) words.push({ sp: true, st: run }); else words.push({ t: tok, st: run }); }));
        let cur = [], lw = 0, pendingSp = null;
        const push = (t, st) => { const last = cur[cur.length - 1]; if (last && last.st === st) last.t += t; else cur.push({ t, st }); };
        words.forEach(w => {
          if (w.sp) { pendingSp = cur.length ? w.st : null; return; }
          const sw = pendingSp ? measure(' ', pendingSp, size) : 0, ww = measure(w.t, w.st, size);
          if (cur.length && lw + sw + ww > width) { out.push(cur); cur = []; lw = 0; }
          else if (pendingSp) { push(' ', pendingSp); lw += sw; }
          if (ww > width) { // very long word: break it
            let part = '';
            for (const ch of w.t) { if (measure(part + ch, w.st, size) > width && part) { push(part, w.st); out.push(cur); cur = []; lw = 0; part = ch; } else part += ch; }
            push(part, w.st); lw += measure(part, w.st, size);
          } else { push(w.t, w.st); lw += ww; }
          pendingSp = null;
        });
        out.push(cur);
      });
      return out;
    }
    function drawLine(segs, x, base, size, defColor, align, width) {
      let cx = x;
      if (align === 'right') { const tw = segs.reduce((s, g) => s + measure(g.t, g.st, size), 0); cx = x + width - tw; }
      segs.forEach(g => {
        const w = measure(g.t, g.st, size);
        if (g.st.bg) { doc.setFillColor(...g.st.bg); doc.rect(cx, base - size * 0.82, w, size * 1.08, 'F'); }
        const col = g.st.color || defColor;

    const hh = 13; if (y + hh + 40 > BOTTOM) newPage();

    R.items.forEach(it => {
      const dc = it.critical ? RED : INK;
      const blocks = [];
      if (it.loc || it.parties) {
        const lw = it.parties ? cellW * 0.56 : cellW, rw = cellW - lw - 8;
        const L = it.loc ? wrapRuns(plain(it.loc, { b: true }), lw, 8.5) : [];
        const Rr = it.parties ? wrapRuns(plain(it.parties), rw, 8.5) : [];
        const n = Math.max(L.length, Rr.length);
        for (let i = 0; i < n; i++) blocks.push({ kind: 'top', l: L[i] || [], r: Rr[i] || [], lw, rw, h: 10 });
      }
      if (it.title) wrapRuns(plain(it.title, { u: true }), cellW, FS).forEach(l => blocks.push({ kind: 'line', line: l, color: dc, h: LH }));
      if (it.lines && it.lines.some(l => l.length)) wrapRuns(it.lines, cellW, FS).forEach(l => blocks.push({ kind: 'line', line: l, color: dc, h: LH }));
      (it.updates || []).forEach(u => {
        const lines = (u.lines || [[]]).map(l => l.slice());
        if (u.dateMDY) lines[0] = [{ t: u.dateMDY + ': ' }, ...(lines[0] || [])];
        wrapRuns(lines, cellW, FS).forEach(l => blocks.push({ kind: 'line', line: l, color: dc, h: LH }));
      });
      const imgs = (it.photos || []).filter(p => p.data), docs = (it.photos || []).filter(p => !p.data);
      for (let i = 0; i < imgs.length; i += perRow) {
        const row = imgs.slice(i, i + perRow).map(p => {
          const s = Math.min(PH / p.w, PH_MAXH / p.h), iw = p.w * s, ih = p.h * s;
          const cap = p.caption ? wrapRuns(plain(p.caption), PH, 7).slice(0, 2) : [];
          return { ...p, iw, ih, cap, h: cap.length * 8 + ih + (p.dateText ? 9 : 0) };
        });
        blocks.push({ kind: 'photos', row, h: Math.max(...row.map(p => p.h)) + 6 });
      }
      docs.forEach(p => blocks.push({ kind: 'line', line: wrapRuns(plain('Attachment: ' + (p.caption || p.pdfName || 'document')), cellW, FS)[0], color: GREY, h: LH }));
      if (!blocks.length) blocks.push({ kind: 'line', line: [], color: INK, h: LH });

      if (y + PAD + blocks[0].h + PAD > BOTTOM) newPage();
      let segTop = y;
      const labels = () => {
        doc.setFont('helvetica', 'bold'); doc.setFontSize(FS); doc.setTextColor(...INK);
        doc.text(String(it.num || ''), COLS[0] + PAD, segTop + PAD + 7.6);
        doc.text(String(it.statusLabel || '').toUpperCase(), COLS[1] + PAD, segTop + PAD + 7.6);
      };
      labels(); y += PAD;
      blocks.forEach(b => {
        if (y + b.h > BOTTOM) { frame(segTop, y + PAD); newPage(); segTop = y; y += PAD; }
        if (b.kind === 'top') { drawLine(b.l, cellX, y + 7.2, 8.5, INK); drawLine(b.r, cellX + b.lw + 8, y + 7.2, 8.5, INK, 'right', b.rw); y += b.h; }
        else if (b.kind === 'line') { drawLine(b.line, cellX, y + 7.6, FS, b.color); y += b.h; }
        else if (b.kind === 'photos') {
          let x = cellX; const top = y + 3;
          b.row.forEach(p => {
            let py = top;
            p.cap.forEach(l => { drawLine(l, x, py + 6, 7, INK); py += 8; });
            doc.addImage(p.data, 'JPEG', x, py, p.iw, p.ih, undefined, 'FAST'); py += p.ih;
            if (p.dateText) { doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(...GREY); doc.text(p.dateText, x, py + 7); }
            x += PH + PH_GAP;
          });
          y += b.h;
        }
      });
      y += PAD;
      frame(segTop, y);
    });

    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i);
      doc.setFontSize(8.5); doc.setTextColor(...INK);
      doc.setFont('helvetica', 'normal'); doc.text('Project: ', M, H - 34);

      doc.setFont('helvetica', 'normal'); doc.text('Field Report', W / 2, H - 34, { align: 'center' });
      doc.text(String(i), W - M, H - 34, { align: 'right' });
    }
    return doc;
  }

  async function logoPng() {
    try {
      const w = 852, h = 390;
      const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(logoSvg('#293d9a', `width="${w}" height="${h}"`)); });
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      return { data: c.toDataURL('image/png'), w, h };
    } catch (e) { return null; }
  }
  async function loadForPdf(id) {
    const img = await new Promise((res) => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = () => res(null); im.src = blobUrl(id); });
    if (!img || !img.naturalWidth) return null;
    const s = Math.min(1, 360 / img.naturalWidth, 540 / img.naturalHeight);
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    return { data: c.toDataURL('image/jpeg', 0.85), w: c.width, h: c.height };
  }
  async function exportPdf(r) {
    if (!window.jspdf || !window.jspdf.jsPDF) { toast('The PDF tool didn\'t load. Reload the page and try again.'); return; }
    if (!S.downloads) { toast('The download didn\'t start. Try again in Chrome or Safari.'); return; }
    const rows = reportRows(r);
    const total = rows.reduce((n, x) => n + x.photos.filter(p => p.kind !== 'pdf').length, 0);
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="dialog prog"><h4>Building PDF</h4><p id="pg-t">Preparing ${total} photo${total === 1 ? '' : 's'}…</p><div class="bar2"><i id="pg-b"></i></div></div>`;
    document.body.appendChild(o);
    try {
      let done = 0;
      const R = { project: r.project, reportDateMDY: mdy(r.reportDate), reportDateLong: longDate(r.reportDate), visitDateLong: longDate(siteOf(r)), revision: r.revision || 'n/a', disclaimer: DISCLAIMER, items: [] };
      for (const row of rows) {
        const it = row.item, photos = [];
        for (const p of row.photos) {
          if (p.kind === 'pdf') { photos.push({ caption: p.caption, pdfName: p.name }); continue; }
          const im = await loadForPdf(p.id);
          done++; $('#pg-t', o).textContent = `Preparing photos (${done} of ${total})…`; $('#pg-b', o).style.width = Math.round(done / Math.max(1, total) * 100) + '%';
          if (im) photos.push({ caption: p.caption, dateText: p.addedAt ? 'Uploaded ' + mdy(photoDate(p)) : '', ...im });
        }
        R.items.push({ num: it.num, statusLabel: row.status === 'closed' ? 'Closed' : 'Open', critical: it.critical, loc: locationText(it), parties: partiesText(it), title: it.title,
          lines: richToLines(it.desc), updates: row.updates.map(u => ({ dateMDY: u.date ? mdy(u.date) : '', lines: richToLines(u.text) })), photos });
      }
      $('#pg-t', o).textContent = 'Laying out pages…';
      const doc = buildFieldReportPdf(window.jspdf.jsPDF, R, { logo: await logoPng() });
      const blob = doc.output('blob');
      const v = parseDate(siteOf(r)), cfg = projCfg(r.project);
      const fname = `${(cfg.projectNo || r.projectNo || r.project || 'Project').replace(/[\\/:*?"<>|]+/g, '-')}-SMBM-${pad2(v.getMonth() + 1)}.${pad2(v.getDate())}.${v.getFullYear()}_Field_Report.pdf`;
      o.remove();
      await S.downloads.save({ filename: fname, data: blob });
      toast('PDF saved');
    } catch (e) {
      o.remove();
      const code = e && e.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') toast('A download prompt is already open. Finish that one first.');
      else if (code === 'unavailable' || code === 'not_granted' || code === 'capability_disabled') toast('The download didn\'t start. Try again in Chrome or Safari.');
      else toast('The PDF couldn\'t be built. Try again, and tell the page owner if it keeps failing.');
    }
  }

    const fields = oldFields.filter(f => f && f !== fl);

      const c = normCfg(SEED_E10); c.projectNo = (sample && sample.projectNo) || c.projectNo; c.fields = normCfg({ fields }).fields;
      return { cfg: c, flId: fl ? fl.id : null };
    }
    const parties = arr((raw.projectParties || {})[project] || raw.parties).map(n => ({ trade: '', name: str(n) })).filter(p => p.name);
    return { cfg: normCfg({ projectNo: sample && sample.projectNo, levels: fl ? arr(fl.options).map(normLevel) : [], rooms: [], parties: parties.length ? parties : defaultCfg().parties, fields }), flId: fl ? fl.id : null };

  async function migrate() {
    if (S.migrating) return;
    S.migrating = true; render();
    try {
      const old = S.reports.filter(r => r._old);
      const oldKey = (r) => (r.reportDate || '') + '|' + String(r.createdAt || 0).padStart(15, '0');
      const asc = [...old].sort((a, b) => oldKey(a).localeCompare(oldKey(b)));
      const latest = new Map(), firstSeen = new Map(), photoSeen = new Map();
      asc.forEach(r => r._old.forEach(it => {
        if (!it || !it.key) return; const site = siteOf(r);
        if (!firstSeen.has(it.key)) firstSeen.set(it.key, site);
        latest.set(it.key, { it, r });
        arr(it.photos).forEach(p => [p && p.id, p && p.original].forEach(id => { if (id && !photoSeen.has(id)) photoSeen.set(id, site); }));
      }));
      const projects = { ...S.projects }, flIds = {};
      asc.forEach(r => { const c = cfgFromOld(r.project, r); if (!projects[r.project]) projects[r.project] = c.cfg; if (!(r.project in flIds)) flIds[r.project] = c.flId; });
      for (const [key, { it, r }] of latest) {
        const cfg = projects[r.project], flId = flIds[r.project], site = siteOf(r);
        const fields = { ...(it.fields || {}) }; let level = '';
        if (flId && fields[flId]) { level = normLevel(fields[flId]); delete fields[flId]; }
        if (level && !cfg.levels.includes(level)) cfg.levels.push(level);
        const parties = str(it.responsible) ? [str(it.responsible)] : [];
        parties.forEach(n => { if (!cfg.parties.some(p => p.name === n)) cfg.parties.push({ trade: '', name: n }); });
        const updates = [...arr(it.updates).filter(u => u && str(u.note)).map(u => ({ id: uid8(), date: str(u.date).slice(0, 10), text: mdToRich(u.note) })), ...(str(it.note) ? [{ id: uid8(), date: site, text: mdToRich(it.note) }] : [])];
        const photos = arr(it.photos).filter(p => p && p.id).map(p => {
          const cap = str(p.caption);
          const o = { id: p.id, kind: p.kind || 'image', name: p.name || '', caption: /^photo:?$/i.test(cap) ? '' : cap.replace(/:\s*$/, ''), size: p.size || 0, addedAt: toLocalDT(p.addedAt) || toLocalDT(photoSeen.get(p.original || p.id) || site) };

        }));
        await S.db.collection('items').doc(key).set(body);
      }
      await saveSettings({ schema: 2, projects });
      S.projects = projects; S.schema = 2;
      for (const r of old) {
        const raw = { ...r._raw }; raw.legacyItems = raw.items; delete raw.items;

        await S.db.collection('reports').doc(r.id).set(raw);

    if (t.id === 'r-project') { P.rproject = t.value; savePrefs(); renderReportsTab(); return; }
    if (t.dataset.inline && t.dataset.item) {
      const it = S.items.find(i => i.id === t.dataset.item); if (!it) return;
      const k = t.dataset.inline, v = t.value;
      if (k === 'status') updateItemFields(it.id, { status: v }, 'Item ' + (it.num || '') + ' marked ' + STATUS[v].toLowerCase());
      else if (k === 'level') updateItemFields(it.id, { level: v }, v ? 'Level set to ' + v : 'Level cleared');
      else if (k === 'room') updateItemFields(it.id, { room: v }, v ? 'Room set to ' + roomLabel(it.project, v) : 'Room cleared');
      else if (k === 'cf') updateItemFields(it.id, { fields: { ...it.fields, [t.dataset.cf]: v } }, 'Saved');
      return;
    }
    if (S.view !== 'item' || !S.draft) return;
    const d = S.draft;
    if (t.id === 'e-project') {
      collectDraft();
      if (S.draftIsNew && d.project) d.num = nextNum(d.project);
      const cfg = projCfg(d.project);
      if (d.level && !cfg.levels.includes(d.level)) d.level = '';
      if (d.room && !findRoom(d.project, d.room)) d.room = '';
      $('#e-num').value = d.num || '';
      refreshEd('e-level', levelOptions(d)); refreshEd('e-room', roomOptions(d)); refreshEd('e-fields', fieldsHTML(d)); refreshEd('e-parties', partyChips(d));
    }
    else if (t.id === 'e-level') { collectDraft(); const rm = findRoom(d.project, d.room); if (rm && d.level && rm.level !== d.level) d.room = ''; refreshEd('e-room', roomOptions(d)); }
    else if (t.id === 'e-room') { collectDraft(); const rm = findRoom(d.project, d.room); if (rm && rm.level && !d.level) { d.level = rm.level; refreshEd('e-level', levelOptions(d)); refreshEd('e-room', roomOptions(d)); } }
    else if (t.id === 'e-status') {
      t.className = 'status-sel ' + t.value;
      const f = $('#e-closed-fld'), ci = $('#e-closed');
      if (t.value === 'closed') { f.hidden = false; if (!ci.value) ci.value = nowLocal(); } else { f.hidden = true; ci.value = ''; }
    }
    else if (t.dataset.party !== undefined) t.closest('.party').classList.toggle('on', t.checked);
    else if (t.dataset.up) { const fs = Array.from(t.files || []); t.value = ''; if (fs.length) addFiles(fs); }
  });
  ['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, (e) => { const dz = e.target.closest && e.target.closest('[data-drop]'); if (dz) { e.preventDefault(); dz.classList.add('over'); } }));
  document.addEventListener('dragleave', (e) => { const dz = e.target.closest && e.target.closest('[data-drop]'); if (dz && !dz.contains(e.relatedTarget)) dz.classList.remove('over'); });
  document.addEventListener('drop', (e) => { const dz = e.target.closest && e.target.closest('[data-drop]'); if (!dz) return; e.preventDefault(); dz.classList.remove('over'); const fs = Array.from(e.dataTransfer.files || []); if (fs.length) addFiles(fs); });

  // ---------- boot ----------
  function onData() { if (S.view === 'item' || document.querySelector('.overlay')) return; render(); }
  render();
  (async () => {
    const use = (n) => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
    const [db, user, assets, downloads] = await Promise.all([use('db'), use('user'), use('assets'), use('downloads')]);
    S.db = db; S.user = user; S.assets = assets; S.downloads = downloads;
    if (!db) { S.dbMissing = true; render(); return; }
    if (user) {
      try { S.uid = await user.id(); } catch (e) {}
      try { const c = await user.can('data.write'); S.canWrite = c !== false; } catch (e) {}
      try { S.isEditor = await user.canEdit(); } catch (e) {}
    }
    db.doc('settings/app').onSnapshot((snap) => {
      const d = snap.exists ? (snap.data() || {}) : {};
      S.settingsRaw = d; S.schema = Number(d.schema) || 0; S.projects = {};
      if (d.projects && typeof d.projects === 'object') Object.entries(d.projects).forEach(([n, c]) => { S.projects[n] = normCfg(c); });
      S.loaded.settings = true; onData();
    }, () => { S.loaded.settings = true; onData(); });
    db.collection('items').orderBy('createdAt', 'desc').limit(1000).onSnapshot((snap) => {
      S.items = snap.docs.map(x => normItem(x.id, x.data())); S.itemsError = false; S.loaded.items = true; onData();
    }, () => { S.itemsError = true; S.loaded.items = true; onData(); });
    db.collection('reports').orderBy('createdAt', 'desc').limit(1000).onSnapshot((snap) => {
      S.reports = snap.docs.map(x => normReport(x.id, x.data())); S.loaded.reports = true; onData();
    }, () => { app.innerHTML = `<div class="empty"><h3>Reports are unavailable</h3><p>The connection to the report log closed. Reload the page to reconnect.</p></div>`; });
  })();
})();
</script>
